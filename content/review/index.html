<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Revisión del banco de preguntas · GanaConMerito</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <strong>GanaConMerito</strong>
      <span>Revisión del banco de preguntas</span>
    </div>
    <div class="bank-status" id="status">Cargando banco…</div>
  </header>

  <main class="workspace">
    <aside class="explorer" aria-label="Explorador del banco">
      <section class="explorer-section folders-section">
        <div class="section-heading">
          <h2>Carpetas</h2>
          <span id="folderCount"></span>
        </div>
        <nav id="folderList" class="folder-list" aria-label="Carpetas de preguntas"></nav>
      </section>

      <section class="explorer-section questions-section">
        <div class="section-heading">
          <h2>Preguntas</h2>
          <span id="questionCount"></span>
        </div>
        <div class="search-box">
          <input id="searchInput" type="search" placeholder="Buscar por ID o texto…" autocomplete="off">
        </div>
        <div id="questionList" class="question-list" aria-label="Preguntas de la carpeta"></div>
      </section>
    </aside>

    <section class="reader">
      <div class="reader-toolbar">
        <div>
          <span class="folder-badge" id="currentFolderLabel">—</span>
          <span class="position" id="counter">—</span>
        </div>
        <div class="nav-actions">
          <button id="prevBtn" type="button" title="Pregunta anterior">← Anterior</button>
          <button id="nextBtn" type="button" title="Pregunta siguiente">Siguiente →</button>
        </div>
      </div>

      <article id="questionCard" class="question-card loading">
        Cargando preguntas…
      </article>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
