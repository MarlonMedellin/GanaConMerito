name: V4 phase A6 generate and QA

on:
  push:
    paths:
      - '.github/workflows/v4-phase-a6-generate-qa.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Generate A6 items and validate V4
        shell: bash
        run: |
          python - <<'PY'
          import json, os, glob, collections, sys
          base='content/question-bank-v4/items/docentes'
          items=[
          {"id":"DOC-001250","scope":"general","domain":"inclusion","topic":"ajustes_razonables","competency":"resolucion_de_problemas","questionType":"case_analysis","cognitiveLevel":"analyze","context":"Un estudiante usuario de silla de ruedas tiene varias clases en un tercer piso sin ascensor. La solución habitual consiste en que sus compañeros lo carguen por las escaleras, aunque el estudiante expresa miedo y dependencia.","stem":"¿Cuál decisión constituye una respuesta inclusiva y razonable frente a la barrera física?","options":{"A":"Mantener la práctica de cargarlo porque permite que llegue al aula sin modificar la organización escolar.","B":"Trasladar únicamente al estudiante a actividades separadas en el primer piso para evitar riesgos.","C":"Reorganizar de inmediato los espacios o recorridos para garantizar acceso seguro y autónomo, mientras la institución gestiona las adecuaciones de infraestructura necesarias sin excluirlo de las experiencias comunes.","D":"Exigir a la familia contratar una persona que lo movilice dentro de la institución."},"correctAnswer":"C","explanations":{"A":"Traslada el costo de la barrera al estudiante y a sus compañeros y no garantiza seguridad ni autonomía.","B":"Resuelve el acceso mediante segregación y limita la participación en igualdad de condiciones.","C":"Es la mejor respuesta porque elimina o reduce la barrera con medidas inmediatas y de mejora institucional, preservando participación y autonomía.","D":"La responsabilidad de accesibilidad institucional no puede trasladarse como condición económica a la familia."},"hint":"Un ajuste razonable debe remover la barrera sin convertir la inclusión en dependencia o segregación.","learningNote":"Los ajustes razonables pueden ser materiales y organizativos. Frente a barreras físicas, la institución debe buscar accesibilidad, autonomía y participación en el entorno común, no soluciones que expongan al estudiante o lo separen.","source":{"reference":"Decreto 1075 de 2015, artículos 2.3.3.5.1.4 y 2.3.3.5.2.3.5, adicionados por Decreto 1421 de 2017"},"estimatedDifficulty":"medium"},
          {"id":"DOC-001251","scope":"general","domain":"inclusion","topic":"ajustes_razonables","competency":"gestion_de_aula","questionType":"technical_applied","cognitiveLevel":"apply","context":"Una estudiante sorda participa en una clase donde casi toda la información se entrega mediante explicación oral y videos sin subtítulos. El docente considera suficiente sentarla en la primera fila.","stem":"¿Qué ajuste responde mejor a la barrera de comunicación descrita?","options":{"A":"Mantener la clase igual y ubicarla cerca del docente para que observe mejor sus labios.","B":"Proporcionar apoyos de comunicación pertinentes —por ejemplo, subtítulos, recursos visuales, transcripciones y los apoyos de interpretación o mediación que requiera— y verificar que pueda acceder a las mismas consignas y contenidos.","C":"Entregarle un tema más sencillo y distinto para que no dependa de la explicación oral.","D":"Pedir a un compañero que le resuma después de clase lo que considere importante."},"correctAnswer":"B","explanations":{"A":"La ubicación puede ayudar en algunos casos, pero no garantiza por sí sola acceso a toda la información oral y audiovisual.","B":"Es la mejor respuesta porque diversifica y hace accesible la comunicación según la barrera concreta sin reducir el objetivo de aprendizaje.","C":"Cambiar a un contenido inferior por la barrera de comunicación no constituye un ajuste pertinente.","D":"Delegar el acceso a un compañero crea dependencia y no asegura información completa ni oportuna."},"hint":"El objetivo es hacer accesible la comunicación, no reducir el aprendizaje ni trasladar la responsabilidad a un compañero.","learningNote":"La accesibilidad incluye información y comunicaciones. Los apoyos deben elegirse según la necesidad del estudiante y garantizar acceso oportuno a los mismos propósitos y contenidos educativos.","source":{"reference":"Decreto 1075 de 2015, artículo 2.3.3.5.1.4, definiciones de accesibilidad y ajustes razonables, adicionado por Decreto 1421 de 2017"},"estimatedDifficulty":"medium"},
          {"id":"DOC-001252","scope":"general","domain":"inclusion","topic":"ajustes_razonables","competency":"decision_pedagogica","questionType":"reasoning","cognitiveLevel":"apply","context":"Un estudiante con discapacidad visual utiliza lector de pantalla. La plataforma del curso contiene guías escaneadas como imágenes sin texto reconocible y controles que no pueden manejarse con teclado.","stem":"¿Qué respuesta es más adecuada?","options":{"A":"Mantener la plataforma y ampliar el plazo, porque más tiempo compensa cualquier barrera tecnológica.","B":"Solicitar que un familiar lea permanentemente los materiales al estudiante.","C":"Entregar materiales en formatos digitales accesibles y asegurar que los recursos y controles puedan utilizarse con tecnologías de apoyo, manteniendo los mismos objetivos de aprendizaje.","D":"Eximirlo de las actividades digitales para evitar dificultades técnicas."},"correctAnswer":"C","explanations":{"A":"El tiempo adicional no elimina una barrera de acceso al contenido o a la navegación.","B":"La dependencia de un familiar no sustituye la obligación de accesibilidad y reduce autonomía.","C":"Es la mejor respuesta porque actúa directamente sobre la barrera tecnológica y preserva el objetivo educativo.","D":"Excluir al estudiante de experiencias comunes no resuelve la inaccesibilidad del entorno."},"hint":"Un ajuste eficaz cambia el entorno que genera la barrera, no solo el plazo para enfrentarla.","learningNote":"La accesibilidad educativa también es digital. Formatos compatibles con tecnologías de apoyo y navegación accesible son medidas que permiten participación autónoma sin disminuir expectativas de aprendizaje.","source":{"reference":"Decreto 1075 de 2015, artículo 2.3.3.5.1.4, definición de accesibilidad; artículo 2.3.3.5.2.3.5 sobre apoyos y ajustes, adicionado por Decreto 1421 de 2017"},"estimatedDifficulty":"medium"},
          {"id":"DOC-001253","scope":"general","domain":"inclusion","topic":"ajustes_razonables","competency":"gestion_de_aula","questionType":"case_analysis","cognitiveLevel":"judge","context":"El curso realizará una salida pedagógica a un museo. Un estudiante con movilidad reducida no puede subir al bus contratado y el lugar elegido tiene varios recorridos sin acceso. Se propone que permanezca en la biblioteca del colegio con una guía mientras sus compañeros salen.","stem":"¿Cuál decisión refleja mejor una práctica inclusiva?","options":{"A":"Mantener la salida y asignarle una actividad individual en el colegio, porque la logística externa no hace parte de la inclusión escolar.","B":"Cancelar todas las salidas pedagógicas futuras para evitar diferencias entre estudiantes.","C":"Revisar transporte, destino, recorridos y apoyos para hacer posible su participación en la experiencia común; si una barrera no puede resolverse en ese lugar, seleccionar una alternativa que conserve el propósito pedagógico y sea accesible para el grupo.","D":"Permitir que asista solo si su familia aporta transporte especializado y acompañante."},"correctAnswer":"C","explanations":{"A":"La exclusión de una experiencia curricular por una barrera logística contradice la participación en igualdad de condiciones.","B":"La inclusión no exige eliminar oportunidades educativas para todos, sino diseñarlas de modo accesible.","C":"Es la mejor respuesta porque conserva el propósito pedagógico y modifica las condiciones que generan la barrera.","D":"Condicionar la participación a recursos familiares desplaza la responsabilidad institucional y puede producir discriminación económica."},"hint":"La pregunta no es si el estudiante puede adaptarse a la salida, sino si la salida puede organizarse para incluirlo.","learningNote":"Los ajustes razonables deben extenderse a las experiencias curriculares fuera del aula. La planificación anticipada de transporte, espacios y apoyos evita que una barrera logística se convierta en exclusión.","source":{"reference":"Decreto 1075 de 2015, artículo 2.3.3.5.1.4, definiciones de educación inclusiva, accesibilidad y ajustes razonables, adicionado por Decreto 1421 de 2017"},"estimatedDifficulty":"medium"},
          {"id":"DOC-001254","scope":"general","domain":"inclusion","topic":"ajustes_razonables","competency":"analisis_de_evidencia","questionType":"reading_analysis","cognitiveLevel":"analyze","context":"El PIAR de un estudiante dispone recibir instrucciones escritas además de las orales. Tras dos meses, los registros muestran que el estudiante sigue sin comprender consignas extensas y pierde oportunidades de participación. El equipo afirma que no puede modificar el apoyo hasta el siguiente año porque 'ya existe un ajuste aprobado'.","stem":"¿Qué conclusión se deriva mejor del concepto de ajuste razonable?","options":{"A":"La existencia formal del ajuste basta para considerarlo adecuado aunque no reduzca la barrera.","B":"El ajuste debe revisarse con la evidencia disponible, porque su razonabilidad depende de su pertinencia y eficacia para facilitar participación y eliminar exclusión; puede requerir modificación o apoyos adicionales.","C":"Todo ajuste debe mantenerse sin cambios durante un año para preservar igualdad de trato.","D":"La falta de eficacia demuestra que el estudiante no puede participar en el currículo común."},"correctAnswer":"B","explanations":{"A":"Un ajuste que existe en el papel pero no cumple su finalidad no debe asumirse automáticamente como suficiente.","B":"Es la mejor respuesta porque vincula el ajuste con su efecto real sobre la barrera y la participación.","C":"La igualdad no exige conservar medidas ineficaces; el seguimiento permite cambios progresivos.","D":"La persistencia de la barrera exige revisar apoyos, no concluir incapacidad para participar."},"hint":"Evalúa el ajuste por lo que logra, no solo por estar escrito.","learningNote":"Los ajustes razonables son pertinentes y eficaces cuando facilitan participación y eliminan exclusión. El seguimiento pedagógico debe comprobar su efecto y permitir modificaciones progresivas cuando la evidencia lo exige.","source":{"reference":"Decreto 1075 de 2015, artículo 2.3.3.5.1.4, definición de ajustes razonables; artículo 2.3.3.5.2.3.5, adicionado por Decreto 1421 de 2017"},"estimatedDifficulty":"high"},
          {"id":"DOC-001255","scope":"general","domain":"inclusion","topic":"ajustes_razonables","competency":"resolucion_de_problemas","questionType":"technical_applied","cognitiveLevel":"analyze","context":"Una estudiante presenta barreras persistentes de participación y aprendizaje que el equipo puede observar pedagógicamente, pero la familia aún está adelantando una valoración externa. Algunos docentes proponen no realizar ningún ajuste hasta recibir un diagnóstico médico definitivo.","stem":"¿Cuál actuación es más consistente con el marco de educación inclusiva?","options":{"A":"Esperar el diagnóstico definitivo porque ningún apoyo pedagógico puede implementarse antes de una certificación médica.","B":"Aplicar de inmediato una reducción general de contenidos sin analizar la barrera concreta.","C":"Identificar y documentar las barreras observables, implementar apoyos pedagógicos pertinentes y hacer seguimiento, articulando la información de salud cuando exista, sin convertir el diagnóstico en la única condición para responder educativamente.","D":"Trasladar a la estudiante a actividades separadas hasta que termine la valoración externa."},"correctAnswer":"C","explanations":{"A":"El Decreto 1421 define los ajustes a partir de barreras y necesidades de participación; la respuesta educativa no debe quedar paralizada exclusivamente por la ausencia de diagnóstico.","B":"Reducir contenidos sin relación con la barrera puede disminuir injustificadamente las expectativas y no constituye una respuesta razonada.","C":"Es la mejor respuesta porque combina valoración pedagógica, apoyos oportunos, seguimiento y articulación con información externa sin medicalizar la decisión educativa.","D":"La segregación preventiva no elimina la barrera y puede vulnerar el derecho a participar con pares."},"hint":"La escuela necesita comprender la barrera real, no esperar pasivamente una etiqueta clínica.","learningNote":"La educación inclusiva parte de barreras que pueden ser visibles o no y de la valoración pedagógica del estudiante. La información de salud puede ser relevante, pero los apoyos educativos deben responder oportunamente a necesidades observadas y verificarse mediante seguimiento.","source":{"reference":"Decreto 1075 de 2015, artículo 2.3.3.5.1.4, definición de ajustes razonables, adicionado por Decreto 1421 de 2017; MEN, Circular 024 del 31 de marzo de 2026"},"estimatedDifficulty":"high"}
          ]
          for d in items:
              p=f"{base}/{d['id']}.json"
              if os.path.exists(p):raise SystemExit('already exists '+p)
              with open(p,'w',encoding='utf-8') as f:json.dump(d,f,ensure_ascii=False,indent=2);f.write('\n')
          def sp(pairs):
              d={}
              for k,v in pairs:
                  if k in d:raise ValueError('duplicate '+k)
                  d[k]=v
              return d
          def load(p):
              with open(p,encoding='utf-8') as f:return json.load(f,object_pairs_hook=sp)
          domains=load('content/question-bank-v4/taxonomy/domains.json');topics=load('content/question-bank-v4/taxonomy/topics.json');comps=load('content/question-bank-v4/taxonomy/competencies.json');qt=load('content/question-bank-v4/taxonomy/question-types.json');allowed={'domain':set(domains),'topic':set(topics),'competency':set(comps),'questionType':set(qt['questionTypes']),'cognitiveLevel':set(qt['cognitiveLevels']),'estimatedDifficulty':set(qt['estimatedDifficultyLevels'])};req={'id','scope','domain','topic','competency','questionType','cognitiveLevel','context','stem','options','correctAnswer','explanations','hint','learningNote','source','estimatedDifficulty'}
          errs=[];ids=[];counters={k:collections.Counter() for k in allowed};files=sorted(glob.glob(base+'/*.json'))
          for p in files:
              try:d=load(p)
              except Exception as e:errs.append(f'{p}: {e}');continue
              ids.append(d.get('id'))
              if set(d)!=req:errs.append(f'{p}: keys')
              if d.get('scope')!='general':errs.append(f'{p}: scope')
              for k,v in allowed.items():
                  if d.get(k) not in v:errs.append(f'{p}: invalid {k}')
                  counters[k][d.get(k)]+=1
              if set(d.get('options',{}))!={'A','B','C','D'} or set(d.get('explanations',{}))!={'A','B','C','D'}:errs.append(f'{p}: A-D')
              if d.get('correctAnswer') not in {'A','B','C','D'}:errs.append(f'{p}: answer')
              if set(d.get('source',{}))!={'reference'} or not d['source']['reference'].strip():errs.append(f'{p}: source')
          if len(ids)!=len(set(ids)):errs.append('duplicate ids')
          expected=[f'DOC-{i:06d}' for i in range(1250,1256)]
          for x in expected:
              if x not in ids:errs.append('missing '+x)
          cov={'domains':{k:counters['domain'][k] for k in domains},'topics':{k:counters['topic'][k] for k in topics},'competencies':{k:counters['competency'][k] for k in comps},'questionTypes':{k:counters['questionType'][k] for k in qt['questionTypes']},'cognitiveLevels':{k:counters['cognitiveLevel'][k] for k in qt['cognitiveLevels']},'estimatedDifficulty':{k:counters['estimatedDifficulty'][k] for k in qt['estimatedDifficultyLevels']}}
          report={'generatedAt':'2026-08-22','batch':'DOC-PHASE-A6-20260822','itemCount':len(files),'batchIds':expected,'errors':errs,'coverage':cov}
          with open('content/question-bank-v4/COVERAGE-AFTER-PHASE-A6-20260822.json','w',encoding='utf-8') as f:json.dump(report,f,ensure_ascii=False,indent=2);f.write('\n')
          print(json.dumps(report,ensure_ascii=False,indent=2))
          if errs:sys.exit(1)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content/question-bank-v4/items/docentes content/question-bank-v4/COVERAGE-AFTER-PHASE-A6-20260822.json
          git commit -m 'feat(v4): add phase A6 reasonable adjustment items'
          git pull --rebase origin master
          git push origin HEAD:master
