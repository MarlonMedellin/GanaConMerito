name: V4 A+B remediation QA

on:
  push:
    branches: [remediate-v4-phase-a-b-20260822]
    paths:
      - 'content/question-bank-v4/**'
      - '.github/workflows/v4-post-sprint48-qa.yml'
  pull_request:
    branches: [audit-v4-phase-a-b-adversarial-20260822]
    paths:
      - 'content/question-bank-v4/**'
      - '.github/workflows/v4-post-sprint48-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate remediated V4 corpus read-only
        shell: bash
        run: |
          python - <<'PY'
          import collections, json, pathlib, re, statistics, subprocess, sys

          ROOT = pathlib.Path('content/question-bank-v4')
          ITEMS = ROOT / 'items' / 'docentes'
          SNAP = ROOT / 'COVERAGE-AFTER-A-B-REMEDIATION-20260822.json'
          EXPECTED = 248
          REJECTED = {
            'DOC-001206','DOC-001218','DOC-001220','DOC-001222','DOC-001225','DOC-001227',
            'DOC-001228','DOC-001230','DOC-001232','DOC-001246','DOC-001249','DOC-001250',
            'DOC-001251','DOC-001252','DOC-001253','DOC-001254','DOC-001255','DOC-001290'}
          RETIRED = {'DOC-001258','DOC-001259','DOC-001261','DOC-001265','DOC-001268','DOC-001291','DOC-001294'}
          REPLACEMENTS = {f'DOC-{n:06d}' for n in range(1295,1305)}
          PRESERVE = {'DOC-001104','DOC-001110','DOC-001292','DOC-001293'}

          def load(path):
            def hook(pairs):
              out = {}
              for k,v in pairs:
                if k in out: raise ValueError(f'duplicate JSON key {k}')
                out[k] = v
              return out
            return json.loads(path.read_text(encoding='utf-8'), object_pairs_hook=hook)

          def words(x): return len(re.findall(r'\b\w+\b', str(x), re.UNICODE))
          def num(qid): return int(re.fullmatch(r'DOC-(\d{6})', qid).group(1))

          qt = load(ROOT/'taxonomy'/'question-types.json')
          tax = {
            'domain': set(load(ROOT/'taxonomy'/'domains.json')),
            'topic': set(load(ROOT/'taxonomy'/'topics.json')),
            'competency': set(load(ROOT/'taxonomy'/'competencies.json')),
            'questionType': set(qt['questionTypes']),
            'cognitiveLevel': set(qt['cognitiveLevels']),
            'estimatedDifficulty': set(qt['estimatedDifficultyLevels'])}
          required = {'id','scope','domain','topic','competency','questionType','cognitiveLevel','context','stem','options','correctAnswer','explanations','hint','learningNote','source','estimatedDifficulty'}
          coverage = {k: collections.Counter() for k in ['domains','topics','competencies','questionTypes','cognitiveLevels','estimatedDifficulty']}
          cmap = {'domain':'domains','topic':'topics','competency':'competencies','questionType':'questionTypes','cognitiveLevel':'cognitiveLevels','estimatedDifficulty':'estimatedDifficulty'}
          keys = collections.Counter(); rows=[]; seen=set(); errors=[]; outliers=[]; new_outliers=[]
          files = sorted(ITEMS.glob('DOC-*.json'))

          for path in files:
            try: obj = load(path)
            except Exception as e:
              errors.append(f'{path}: {e}'); continue
            missing = required - set(obj)
            if missing: errors.append(f'{path}: missing {sorted(missing)}'); continue
            qid = obj['id']
            if qid in seen: errors.append(f'duplicate id {qid}')
            seen.add(qid)
            if path.stem != qid: errors.append(f'{qid}: filename mismatch')
            if obj['scope'] != 'general': errors.append(f'{qid}: invalid scope')
            for f, allowed in tax.items():
              if obj[f] not in allowed: errors.append(f'{qid}: invalid {f}={obj[f]}')
            if set(obj['options']) != set('ABCD'): errors.append(f'{qid}: options != A-D')
            if obj['correctAnswer'] not in 'ABCD': errors.append(f'{qid}: invalid key')
            if set(obj['explanations']) != set('ABCD'): errors.append(f'{qid}: explanations != A-D')
            if not isinstance(obj['source'],dict) or set(obj['source']) != {'reference'} or not str(obj['source']['reference']).strip(): errors.append(f'{qid}: invalid source')
            for f in ('context','stem','hint','learningNote'):
              if not isinstance(obj[f],str) or not obj[f].strip(): errors.append(f'{qid}: empty {f}')
            for f in cmap: coverage[cmap[f]][obj[f]] += 1
            key = obj['correctAnswer']; keys[key] += 1; rows.append((num(qid),qid,key))
            lens={k:words(v) for k,v in obj['options'].items()}; med=statistics.median(lens[k] for k in 'ABCD' if k!=key); ratio=lens[key]/med if med else 999
            if ratio > 1.65:
              rec={'id':qid,'ratio':round(ratio,3)}; outliers.append(rec)
              if qid in REPLACEMENTS: new_outliers.append(rec)

          if len(files) != EXPECTED: errors.append(f'count {len(files)} != {EXPECTED}')
          if REJECTED & seen: errors.append(f'rejected active: {sorted(REJECTED & seen)}')
          if RETIRED & seen: errors.append(f'historical retired active: {sorted(RETIRED & seen)}')
          if REPLACEMENTS - seen: errors.append(f'replacements missing: {sorted(REPLACEMENTS-seen)}')
          if PRESERVE - seen: errors.append(f'C1/preserved missing: {sorted(PRESERVE-seen)}')
          if new_outliers: errors.append(f'replacement length outliers: {new_outliers}')

          rows.sort(); max_streak=0; streak=0; prev=None; start=None; span=None
          for _,qid,key in rows:
            if key == prev: streak += 1
            else: streak=1; start=qid; prev=key
            if streak > max_streak: max_streak=streak; span=[start,qid,key]
          cov={k:dict(sorted(v.items())) for k,v in coverage.items()}; kd={k:keys.get(k,0) for k in 'ABCD'}
          metrics={'itemCount':len(files),'keyDistribution':kd,'maxKeyStreak':max_streak,'maxKeyStreakSpan':span,'lengthOutlierCount':len(outliers),'replacementLengthOutlierCount':len(new_outliers),'coverage':cov}

          if not SNAP.exists(): errors.append('remediation snapshot missing')
          else:
            snap=load(SNAP)
            for f,actual in [('itemCount',len(files)),('keyDistribution',kd),('maxKeyStreak',max_streak),('coverage',cov)]:
              if snap.get(f) != actual: errors.append(f'snapshot {f} mismatch')
          for f in ['AUDIT-PHASE-A-B-READVERSARIAL-20260822.json','AUDIT-PHASE-A-B-READVERSARIAL-20260822.md']:
            if not (ROOT/f).exists(): errors.append(f'historical audit missing: {f}')

          try:
            base='origin/audit-v4-phase-a-b-adversarial-20260822'
            changed=subprocess.check_output(['git','diff','--name-only',f'{base}...HEAD'],text=True).splitlines()
            exact={'.github/workflows/v4-post-sprint48-qa.yml','content/question-bank-v4/legacy-processing-register.csv','content/question-bank-v4/REMEDIATION-PHASE-A-B-READVERSARIAL-20260822.md','content/question-bank-v4/COVERAGE-AFTER-A-B-REMEDIATION-20260822.json'}
            items={f'content/question-bank-v4/items/docentes/{x}.json' for x in REJECTED|REPLACEMENTS}
            unexpected=sorted(set(changed)-exact-items)
            if unexpected: errors.append(f'out-of-scope files: {unexpected}')
            forbidden=[x for x in changed if x.startswith(('src/','scripts/','supabase/'))]
            if forbidden: errors.append(f'forbidden paths: {forbidden}')
          except Exception as e: errors.append(f'scope diff check failed: {e}')

          print('FINAL_METRICS_JSON='+json.dumps(metrics,ensure_ascii=False,sort_keys=True))
          if errors:
            for e in errors: print('ERROR:',e)
            sys.exit(1)
          print('QA_OK: remediated corpus is internally consistent and read-only checks passed')
          PY
