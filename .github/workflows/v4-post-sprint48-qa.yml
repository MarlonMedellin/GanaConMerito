name: V4 A+B remediation QA

on:
  push:
    branches:
      - remediate-v4-phase-a-b-20260822
    paths:
      - 'content/question-bank-v4/**'
      - '.github/workflows/v4-post-sprint48-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate remediated V4 corpus read-only
        shell: bash
        run: |
          python - <<'PY'
          import collections
          import glob
          import json
          import os
          import pathlib
          import re
          import statistics
          import subprocess
          import sys

          ROOT = pathlib.Path('content/question-bank-v4')
          ITEMS = ROOT / 'items' / 'docentes'
          SNAPSHOT = ROOT / 'COVERAGE-AFTER-A-B-REMEDIATION-20260822.json'
          AUDIT_JSON = ROOT / 'AUDIT-PHASE-A-B-READVERSARIAL-20260822.json'
          AUDIT_MD = ROOT / 'AUDIT-PHASE-A-B-READVERSARIAL-20260822.md'
          EXPECTED_COUNT = 248

          rejected = {
              'DOC-001206','DOC-001218','DOC-001220','DOC-001222','DOC-001225','DOC-001227',
              'DOC-001228','DOC-001230','DOC-001232','DOC-001246','DOC-001249','DOC-001250',
              'DOC-001251','DOC-001252','DOC-001253','DOC-001254','DOC-001255','DOC-001290'
          }
          historical_retired = {
              'DOC-001258','DOC-001259','DOC-001261','DOC-001265','DOC-001268',
              'DOC-001291','DOC-001294'
          }
          all_retired = rejected | historical_retired
          replacements = {f'DOC-{n:06d}' for n in range(1295, 1305)}
          must_remain_active = {'DOC-001104','DOC-001110','DOC-001292','DOC-001293'}

          tax = {
              'domain': set(json.load(open(ROOT/'taxonomy'/'domains.json', encoding='utf-8'))),
              'topic': set(json.load(open(ROOT/'taxonomy'/'topics.json', encoding='utf-8'))),
              'competency': set(json.load(open(ROOT/'taxonomy'/'competencies.json', encoding='utf-8'))),
              'questionType': set(json.load(open(ROOT/'taxonomy'/'question-types.json', encoding='utf-8'))),
              'cognitiveLevel': set(json.load(open(ROOT/'taxonomy'/'cognitive-levels.json', encoding='utf-8'))),
              'estimatedDifficulty': set(json.load(open(ROOT/'taxonomy'/'difficulty-levels.json', encoding='utf-8'))),
          }

          required = {
              'id','scope','domain','topic','competency','questionType','cognitiveLevel',
              'context','stem','options','correctAnswer','explanations','hint','learningNote',
              'source','estimatedDifficulty'
          }
          errors = []
          rows = []
          seen = set()
          coverage = {
              'domains': collections.Counter(),
              'topics': collections.Counter(),
              'competencies': collections.Counter(),
              'questionTypes': collections.Counter(),
              'cognitiveLevels': collections.Counter(),
              'estimatedDifficulty': collections.Counter(),
          }
          key_dist = collections.Counter()
          length_outliers = []
          replacement_length_outliers = []

          files = sorted(ITEMS.glob('DOC-*.json'))
          for path in files:
              try:
                  obj = json.load(open(path, encoding='utf-8'), object_pairs_hook=lambda pairs: _pairs_no_dupes(pairs, str(path)))
              except Exception as exc:
                  errors.append(f'{path}: invalid JSON or duplicate key: {exc}')
                  continue

              missing = sorted(required - set(obj))
              if missing:
                  errors.append(f'{path}: missing fields {missing}')
                  continue

              qid = obj['id']
              if qid in seen:
                  errors.append(f'{path}: duplicate id {qid}')
              seen.add(qid)
              if path.stem != qid:
                  errors.append(f'{path}: filename/id mismatch {qid}')
              if obj['scope'] != 'general':
                  errors.append(f'{qid}: scope must be general')
              for field, allowed in tax.items():
                  if obj[field] not in allowed:
                      errors.append(f'{qid}: invalid {field}={obj[field]}')
              if set(obj['options']) != {'A','B','C','D'}:
                  errors.append(f'{qid}: options must be exactly A-D')
              if obj['correctAnswer'] not in {'A','B','C','D'}:
                  errors.append(f'{qid}: invalid correctAnswer')
              if set(obj['explanations']) != {'A','B','C','D'}:
                  errors.append(f'{qid}: explanations must be exactly A-D')
              if not isinstance(obj.get('source'), dict) or not str(obj['source'].get('reference','')).strip():
                  errors.append(f'{qid}: missing source.reference')
              for field in ('context','stem','hint','learningNote'):
                  if not isinstance(obj[field], str) or not obj[field].strip():
                      errors.append(f'{qid}: empty {field}')

              coverage['domains'][obj['domain']] += 1
              coverage['topics'][obj['topic']] += 1
              coverage['competencies'][obj['competency']] += 1
              coverage['questionTypes'][obj['questionType']] += 1
              coverage['cognitiveLevels'][obj['cognitiveLevel']] += 1
              coverage['estimatedDifficulty'][obj['estimatedDifficulty']] += 1
              key_dist[obj['correctAnswer']] += 1

              opts = obj['options']
              lengths = {k: word_count(v) for k,v in opts.items()}
              c = obj['correctAnswer']
              med = statistics.median(lengths[k] for k in 'ABCD' if k != c)
              ratio = (lengths[c] / med) if med else 999
              if ratio > 1.65:
                  rec = {'id': qid, 'ratio': round(ratio,3), 'correctWords': lengths[c], 'distractorMedian': med}
                  length_outliers.append(rec)
                  if qid in replacements:
                      replacement_length_outliers.append(rec)
              rows.append((numeric_id(qid), qid, obj['correctAnswer']))

          if len(files) != EXPECTED_COUNT:
              errors.append(f'active item count {len(files)} != {EXPECTED_COUNT}')
          if rejected & seen:
              errors.append(f'rejected IDs still active: {sorted(rejected & seen)}')
          if historical_retired & seen:
              errors.append(f'historical retired IDs active: {sorted(historical_retired & seen)}')
          if replacements - seen:
              errors.append(f'approved replacements missing: {sorted(replacements - seen)}')
          if must_remain_active - seen:
              errors.append(f'C1/preserved IDs missing: {sorted(must_remain_active - seen)}')
          if replacement_length_outliers:
              errors.append(f'new replacement length outliers: {replacement_length_outliers}')

          rows.sort()
          max_streak = 0
          streak = 0
          prev = None
          streak_start = None
          max_span = None
          current_start = None
          for _, qid, key in rows:
              if key == prev:
                  streak += 1
              else:
                  streak = 1
                  current_start = qid
                  prev = key
              if streak > max_streak:
                  max_streak = streak
                  streak_start = current_start
                  max_span = (streak_start, qid, key)

          cov_json = {k: dict(sorted(v.items())) for k,v in coverage.items()}
          key_json = {k: key_dist.get(k,0) for k in 'ABCD'}
          metrics = {
              'itemCount': len(files),
              'keyDistribution': key_json,
              'maxKeyStreak': max_streak,
              'maxKeyStreakSpan': max_span,
              'lengthOutlierCount': len(length_outliers),
              'replacementLengthOutlierCount': len(replacement_length_outliers),
              'coverage': cov_json,
          }

          if SNAPSHOT.exists():
              snap = json.load(open(SNAPSHOT, encoding='utf-8'))
              if snap.get('itemCount') != len(files):
                  errors.append('snapshot itemCount does not match files')
              if snap.get('keyDistribution') != key_json:
                  errors.append('snapshot keyDistribution does not match files')
              if snap.get('maxKeyStreak') != max_streak:
                  errors.append('snapshot maxKeyStreak does not match files')
              if snap.get('coverage') != cov_json:
                  errors.append('snapshot coverage does not match files')

          if not AUDIT_JSON.exists() or not AUDIT_MD.exists():
              errors.append('historical adversarial audit artifacts missing')

          # Scope control against the authoritative audit branch.
          try:
              subprocess.run([
                  'git','fetch','origin','audit-v4-phase-a-b-adversarial-20260822:'
                  'refs/remotes/origin/audit-v4-phase-a-b-adversarial-20260822'
              ], check=True, stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True)
              changed = subprocess.check_output([
                  'git','diff','--name-only',
                  'origin/audit-v4-phase-a-b-adversarial-20260822...HEAD'
              ], text=True).splitlines()
              permitted_exact = {
                  '.github/workflows/v4-post-sprint48-qa.yml',
                  'content/question-bank-v4/legacy-processing-register.csv',
                  'content/question-bank-v4/REMEDIATION-PHASE-A-B-READVERSARIAL-20260822.md',
                  'content/question-bank-v4/COVERAGE-AFTER-A-B-REMEDIATION-20260822.json',
              }
              permitted_items = {f'content/question-bank-v4/items/docentes/{x}.json' for x in rejected|replacements}
              unexpected = sorted(set(changed) - permitted_exact - permitted_items)
              if unexpected:
                  errors.append(f'out-of-scope changed files: {unexpected}')
              forbidden_prefixes = ('src/','scripts/','supabase/')
              forbidden = [x for x in changed if x.startswith(forbidden_prefixes)]
              if forbidden:
                  errors.append(f'forbidden paths changed: {forbidden}')
          except Exception as exc:
              errors.append(f'scope diff check failed: {exc}')

          print('FINAL_METRICS_JSON=' + json.dumps(metrics, ensure_ascii=False, sort_keys=True))
          if length_outliers:
              print('CORPUS_LENGTH_OUTLIERS=' + json.dumps(length_outliers, ensure_ascii=False))
          if errors:
              for e in errors:
                  print('ERROR:', e)
              sys.exit(1)
          print('QA_OK: remediated corpus is internally consistent and read-only checks passed')

          def _unused():
              pass
          PY
        env:
          PYTHONUNBUFFERED: '1'

# Helper definitions are injected before execution by rewriting the heredoc below.
