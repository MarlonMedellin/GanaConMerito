name: V4 phase A4 generate and QA

on:
  push:
    paths:
      - '.github/workflows/v4-phase-a4-generate-qa.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Generate A4 items and validate V4
        shell: bash
        run: |
          python - <<'PY'
          import json, os, glob, collections, sys
          base='content/question-bank-v4/items/docentes'
          items=[
          {"id":"DOC-001234","scope":"general","domain":"curriculo","topic":"prae_proyectos_transversales","competency":"planeacion_pedagogica","questionType":"technical_applied","cognitiveLevel":"apply","context":"Una institución quiere crear su PRAE y propone copiar un proyecto exitoso de otra ciudad sobre contaminación marina, aunque su diagnóstico local identifica como problema prioritario el deterioro de una quebrada y la disposición inadecuada de residuos.","stem":"¿Qué decisión se ajusta mejor al propósito del PRAE?","options":{"A":"Copiar el proyecto marino porque un modelo exitoso evita la necesidad de diagnóstico propio.","B":"Partir del diagnóstico ambiental local o regional, incorporar el proyecto al PEI y orientar acciones educativas a la comprensión y solución del problema ambiental específico identificado.","C":"Limitar el proyecto a una unidad de Ciencias Naturales sin relacionarlo con el PEI.","D":"Elegir el tema que tenga más materiales disponibles en internet, aunque no se relacione con el territorio."},"correctAnswer":"B","explanations":{"A":"El PRAE debe responder a diagnósticos y problemas ambientales pertinentes al contexto.","B":"Es la mejor respuesta porque articula diagnóstico, PEI y resolución de problemas ambientales específicos.","C":"El PRAE no es una unidad aislada de una asignatura.","D":"La disponibilidad de recursos no sustituye la pertinencia territorial."},"hint":"El proyecto ambiental escolar nace del territorio, no de una plantilla.","learningNote":"El Decreto 1743 exige incorporar el PRAE al PEI y fundamentarlo en diagnósticos ambientales locales, regionales o nacionales orientados a problemas específicos.","source":{"reference":"Decreto 1743 de 1994, artículo 1"},"estimatedDifficulty":"medium"},
          {"id":"DOC-001235","scope":"general","domain":"curriculo","topic":"prae_proyectos_transversales","competency":"comprension_conceptual","questionType":"conceptual","cognitiveLevel":"understand","context":"El área de Ciencias Naturales asume que el PRAE le pertenece exclusivamente y que las demás áreas solo deben participar en una actividad anual de reciclaje.","stem":"¿Qué principio del PRAE contradice esa organización?","options":{"A":"La educación ambiental debe concentrarse en una sola disciplina para mantener rigor científico.","B":"La educación ambiental incorpora interdisciplinariedad, participación, regionalización, formación en valores y resolución de problemas, y debe estar presente en los componentes del currículo.","C":"El PRAE es extracurricular y por eso no debe relacionarse con otras áreas.","D":"La participación de otras áreas solo procede cuando la secretaría de educación lo ordena cada año."},"correctAnswer":"B","explanations":{"A":"La regulación define la interdisciplina como principio rector.","B":"Es la formulación que recoge el carácter transversal e interdisciplinario del PRAE.","C":"El PRAE se integra al PEI y al currículo.","D":"La participación no depende de una autorización anual extraordinaria."},"hint":"El problema es tratar el PRAE como propiedad de una asignatura.","learningNote":"La educación ambiental debe atravesar el currículo y combinar saberes, participación democrática, valores, contexto territorial y resolución de problemas.","source":{"reference":"Decreto 1743 de 1994, artículo 2"},"estimatedDifficulty":"low"},
          {"id":"DOC-001236","scope":"general","domain":"gestion_educativa","topic":"prae_proyectos_transversales","competency":"decision_pedagogica","questionType":"case_analysis","cognitiveLevel":"analyze","context":"El rector encarga a un solo docente redactar y ejecutar todo el PRAE y señala que estudiantes y familias serán invitados únicamente el día de la socialización final.","stem":"¿Qué cambio fortalece la gobernanza del proyecto?","options":{"A":"Mantener la responsabilidad individual para evitar opiniones diversas.","B":"Reconocer la responsabilidad compartida de estudiantes, familias, docentes y comunidad educativa en diseño y desarrollo, articulándola mediante los órganos del gobierno escolar.","C":"Delegar el PRAE únicamente al Consejo Académico y excluir a los demás estamentos.","D":"Contratar una entidad externa para que diseñe el proyecto sin participación escolar."},"correctAnswer":"B","explanations":{"A":"Reduce un proyecto institucional y participativo a una tarea individual.","B":"Corresponde a la responsabilidad compartida establecida por la norma.","C":"El Consejo Académico puede participar, pero no sustituye a la comunidad educativa.","D":"La asesoría externa puede apoyar, no reemplazar la responsabilidad institucional."},"hint":"Un PRAE sostenible se construye con la comunidad, no para la comunidad.","learningNote":"El Decreto 1743 asigna responsabilidad compartida a estudiantes, padres, docentes y comunidad educativa, ejercida a través de los órganos del gobierno escolar.","source":{"reference":"Decreto 1743 de 1994, artículo 3"},"estimatedDifficulty":"medium"},
          {"id":"DOC-001237","scope":"general","domain":"gestion_educativa","topic":"prae_proyectos_transversales","competency":"resolucion_de_problemas","questionType":"reasoning","cognitiveLevel":"analyze","context":"El colegio enfrenta un problema de calidad del agua que supera su capacidad técnica. Algunos integrantes consideran que pedir apoyo externo significa perder autonomía del PRAE.","stem":"¿Qué actuación es más pertinente?","options":{"A":"Evitar cualquier apoyo para proteger la autonomía y trabajar solo con conocimientos internos.","B":"Coordinar acciones y buscar asesoría en instituciones de educación superior y organismos públicos o privados de la localidad o región, manteniendo el proyecto bajo responsabilidad de la comunidad educativa.","C":"Entregar por completo el PRAE a la entidad externa y retirar a estudiantes y docentes de su desarrollo.","D":"Suspender el proyecto hasta que un docente obtenga formación especializada formal."},"correctAnswer":"B","explanations":{"A":"La regulación promueve expresamente la búsqueda de asesoría y apoyo.","B":"Combina apoyo técnico con responsabilidad escolar y contextualización.","C":"La asesoría no supone transferir la responsabilidad institucional.","D":"La necesidad de apoyo no obliga a paralizar el proceso."},"hint":"Autonomía no significa aislamiento técnico.","learningNote":"Los establecimientos pueden coordinar y buscar apoyo en universidades y organismos públicos o privados locales o regionales para fortalecer el PRAE.","source":{"reference":"Decreto 1743 de 1994, artículos 3 y 4"},"estimatedDifficulty":"medium"},
          {"id":"DOC-001238","scope":"general","domain":"gestion_educativa","topic":"prae_proyectos_transversales","competency":"analisis_de_evidencia","questionType":"reading_analysis","cognitiveLevel":"analyze","context":"Tras un año de PRAE, el informe institucional solo registra cuántas carteleras y jornadas de limpieza se realizaron. No analiza cambios en el problema ambiental, en la calidad de vida ni en la participación comunitaria.","stem":"¿Qué falta para una evaluación pertinente del proyecto?","options":{"A":"Contabilizar únicamente más actividades para demostrar ejecución.","B":"Evaluar periódicamente, al menos una vez al año, el impacto del PRAE en la calidad de vida y en la solución de problemas relacionados con el diagnóstico ambiental, con participación de la comunidad y actores vinculados.","C":"Sustituir la evaluación por una exposición fotográfica de las actividades.","D":"Esperar cinco años antes de revisar resultados para no alterar la continuidad del proyecto."},"correctAnswer":"B","explanations":{"A":"Los productos de actividad no muestran por sí solos impacto o pertinencia.","B":"Es la lógica de evaluación prevista por el Decreto 1743.","C":"Las fotografías pueden ser evidencia complementaria, no evaluación suficiente.","D":"La norma prevé evaluación periódica al menos anual."},"hint":"Diferencia productos realizados de cambios producidos en el problema ambiental.","learningNote":"La evaluación del PRAE debe mirar impacto, solución de problemas y ajuste a necesidades, no solo contar actividades ejecutadas.","source":{"reference":"Decreto 1743 de 1994, artículo 6"},"estimatedDifficulty":"medium"},
          {"id":"DOC-001239","scope":"general","domain":"practica_docente","topic":"prae_proyectos_transversales","competency":"planeacion_pedagogica","questionType":"normative_applied","cognitiveLevel":"apply","context":"Estudiantes de educación media quieren orientar su servicio social obligatorio a un proceso de recuperación ambiental comunitaria articulado con el PRAE.","stem":"¿Cuál diseño está respaldado por la regulación?","options":{"A":"Impedirlo porque el servicio social no puede relacionarse con educación ambiental.","B":"Permitir su participación directa en el PRAE, en grupos ecológicos escolares o en actividades comunitarias de educación ambiental dirigidas a problemas específicos.","C":"Autorizarlo solo si las actividades se realizan fuera de todo proyecto institucional.","D":"Sustituir el servicio social por una prueba escrita sobre ecología."},"correctAnswer":"B","explanations":{"A":"El Decreto 1743 contempla expresamente esta posibilidad.","B":"Describe las formas previstas para articular servicio social y educación ambiental.","C":"La articulación institucional es compatible y deseable.","D":"Una prueba escrita no equivale al servicio social previsto."},"hint":"El PRAE puede ser también un escenario de acción comunitaria estudiantil.","learningNote":"Los estudiantes de media pueden prestar servicio social obligatorio en educación ambiental mediante participación directa en PRAE, grupos ecológicos o actividades comunitarias.","source":{"reference":"Decreto 1743 de 1994, artículo 7"},"estimatedDifficulty":"medium"},
          {"id":"DOC-001240","scope":"general","domain":"practica_docente","topic":"prae_proyectos_transversales","competency":"juicio_profesional","questionType":"case_analysis","cognitiveLevel":"judge","context":"Una institución ubicada en territorio de una comunidad étnica diseña un PRAE sin consultar prácticas locales de manejo del agua y descarta los saberes comunitarios porque considera que solo las explicaciones técnicas externas son válidas.","stem":"¿Qué ajuste es necesario?","options":{"A":"Mantener el diseño porque la educación ambiental debe ser idéntica en todo el país.","B":"Incorporar el respeto por las características culturales, sociales y naturales de la comunidad y dialogar con sus tradiciones, contrastándolas pedagógicamente con otros saberes pertinentes.","C":"Reemplazar todo conocimiento científico por las tradiciones locales.","D":"Excluir el problema del agua para evitar controversias culturales."},"correctAnswer":"B","explanations":{"A":"El Decreto 1743 exige atención a las características y tradiciones de las comunidades étnicas.","B":"Es la mejor respuesta porque integra pertinencia intercultural sin renunciar al diálogo entre saberes.","C":"El respeto cultural no exige eliminar conocimiento científico.","D":"Evitar el problema contradice la orientación del PRAE hacia problemáticas ambientales específicas."},"hint":"La pertinencia ambiental también es cultural y territorial.","learningNote":"La educación ambiental con comunidades étnicas debe respetar sus características culturales, sociales y naturales y atender sus propias tradiciones.","source":{"reference":"Decreto 1743 de 1994, artículo 1, inciso sobre comunidades étnicas"},"estimatedDifficulty":"medium"},
          {"id":"DOC-001241","scope":"general","domain":"curriculo","topic":"prae_proyectos_transversales","competency":"analisis_de_evidencia","questionType":"reasoning","cognitiveLevel":"analyze","context":"La evaluación anual muestra que el PRAE logró alta participación, pero el indicador ambiental que originó el proyecto no mejora y nuevas mediciones identifican una fuente de contaminación que no estaba en el diagnóstico inicial.","stem":"¿Qué decisión es más coherente con una gestión educativa basada en evidencia?","options":{"A":"Mantener exactamente las mismas acciones porque modificar el PRAE demostraría fracaso.","B":"Ajustar el proyecto a la nueva evidencia, revisar metas y estrategias y conservar las acciones que sí demostraron valor formativo o comunitario.","C":"Eliminar el diagnóstico ambiental y medir solo satisfacción de participantes.","D":"Cerrar el PRAE porque ningún proyecto escolar puede modificarse después de su adopción."},"correctAnswer":"B","explanations":{"A":"La evaluación busca precisamente adecuar el proyecto a necesidades y metas.","B":"Integra evidencia de impacto, aprendizaje institucional y mejora continua.","C":"La satisfacción no sustituye el análisis del problema ambiental diagnosticado.","D":"El proyecto puede y debe ajustarse cuando la evidencia muestra nuevas necesidades."},"hint":"Evaluar un proyecto sirve para decidir qué mantener y qué cambiar.","learningNote":"La evaluación periódica del PRAE debe permitir adecuarlo a las necesidades y metas previstas a partir del impacto observado y de la evolución del diagnóstico ambiental.","source":{"reference":"Decreto 1743 de 1994, artículo 6"},"estimatedDifficulty":"high"}
          ]
          for d in items:
              p=f"{base}/{d['id']}.json"
              if os.path.exists(p): raise SystemExit('already exists '+p)
              with open(p,'w',encoding='utf-8') as f:json.dump(d,f,ensure_ascii=False,indent=2);f.write('\n')
          def sp(pairs):
              d={}
              for k,v in pairs:
                  if k in d:raise ValueError('duplicate '+k)
                  d[k]=v
              return d
          def load(p):
              with open(p,encoding='utf-8') as f:return json.load(f,object_pairs_hook=sp)
          domains=load('content/question-bank-v4/taxonomy/domains.json');topics=load('content/question-bank-v4/taxonomy/topics.json');comps=load('content/question-bank-v4/taxonomy/competencies.json');qt=load('content/question-bank-v4/taxonomy/question-types.json')
          allowed={'domain':set(domains),'topic':set(topics),'competency':set(comps),'questionType':set(qt['questionTypes']),'cognitiveLevel':set(qt['cognitiveLevels']),'estimatedDifficulty':set(qt['estimatedDifficultyLevels'])};req={'id','scope','domain','topic','competency','questionType','cognitiveLevel','context','stem','options','correctAnswer','explanations','hint','learningNote','source','estimatedDifficulty'}
          errs=[];ids=[];counters={k:collections.Counter() for k in allowed};files=sorted(glob.glob(base+'/*.json'))
          for p in files:
              try:d=load(p)
              except Exception as e:errs.append(f'{p}: {e}');continue
              ids.append(d.get('id'))
              if set(d)!=req:errs.append(f'{p}: keys')
              for k,v in allowed.items():
                  if d.get(k) not in v:errs.append(f'{p}: invalid {k}')
                  counters[k][d.get(k)]+=1
              if d.get('scope')!='general':errs.append(f'{p}: scope')
              if set(d.get('options',{}))!={'A','B','C','D'} or set(d.get('explanations',{}))!={'A','B','C','D'}:errs.append(f'{p}: A-D')
              if d.get('correctAnswer') not in {'A','B','C','D'}:errs.append(f'{p}: answer')
          if len(ids)!=len(set(ids)):errs.append('duplicate ids')
          expected=[f'DOC-{i:06d}' for i in range(1234,1242)]
          for x in expected:
              if x not in ids:errs.append('missing '+x)
          cov={'domains':{k:counters['domain'][k] for k in domains},'topics':{k:counters['topic'][k] for k in topics},'competencies':{k:counters['competency'][k] for k in comps},'questionTypes':{k:counters['questionType'][k] for k in qt['questionTypes']},'cognitiveLevels':{k:counters['cognitiveLevel'][k] for k in qt['cognitiveLevels']},'estimatedDifficulty':{k:counters['estimatedDifficulty'][k] for k in qt['estimatedDifficultyLevels']}}
          report={'generatedAt':'2026-08-22','batch':'DOC-PHASE-A4-20260822','itemCount':len(files),'batchIds':expected,'errors':errs,'coverage':cov}
          with open('content/question-bank-v4/COVERAGE-AFTER-PHASE-A4-20260822.json','w',encoding='utf-8') as f:json.dump(report,f,ensure_ascii=False,indent=2);f.write('\n')
          print(json.dumps(report,ensure_ascii=False,indent=2))
          if errs:sys.exit(1)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content/question-bank-v4/items/docentes content/question-bank-v4/COVERAGE-AFTER-PHASE-A4-20260822.json
          git commit -m 'feat(v4): add phase A4 PRAE items'
          git pull --rebase origin master
          git push origin HEAD:master
