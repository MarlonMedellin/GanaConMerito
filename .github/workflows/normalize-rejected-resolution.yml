name: Normalize rejected resolution chains

on:
  pull_request:
    branches:
      - master
    paths:
      - .gcm-rejected-resolution-trigger

permissions:
  contents: write

jobs:
  normalize-register:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Normalize and validate register
        shell: bash
        run: |
          python3 - <<'PY'
          import csv
          from pathlib import Path

          path = Path('content/question-bank-v4/legacy-processing-register.csv')
          fields = [
              'batch_id','processed_at','legacy_id','legacy_path','legacy_blob_sha',
              'factory_agent','factory_decision','audit_agent','audit_decision',
              'v4_item_id','v4_item_path','status','notes'
          ]

          replacements = {
              'docente-aula-basica-secundaria-V3-005': 'REJECTED (gate 10, DOC-000003: clave detectable por longitud); REGENERATE_FROM_ZERO -> processed_serialized.',
              'docente-aula-basica-secundaria-V3-006': 'REJECTED (gate 12, DOC-000009: hint revelador; gate 10, DOC-000023: longitud tras primera regeneracion); REGENERATE_FROM_ZERO -> processed_serialized.',
              'docente-aula-basica-secundaria-V3-007': 'REJECTED (gate 5, DOC-000010: topic planeacion_curricular incorrecto); REGENERATE_FROM_ZERO -> processed_serialized.',
              'docente-aula-basica-secundaria-V3-008': 'REJECTED (gate 5, DOC-000011: topic y competency incorrectos); REGENERATE_FROM_ZERO -> processed_serialized.',
          }

          with path.open('r', encoding='utf-8-sig', newline='') as f:
              rows = list(csv.DictReader(f))

          changed = 0
          for row in rows:
              lid = row['legacy_id']
              if lid in replacements:
                  if row['audit_decision'] != 'APPROVED' or row['status'] != 'processed_serialized':
                      raise SystemExit(f'{lid}: expected APPROVED/processed_serialized before normalization')
                  if not row['v4_item_id'] or not row['v4_item_path']:
                      raise SystemExit(f'{lid}: serialized resolution missing v4 item linkage')
                  if row['notes'] != replacements[lid]:
                      row['notes'] = replacements[lid]
                      changed += 1

          allowed_status = {'processed_serialized', 'processed_discarded'}
          unresolved = []
          invalid = []

          for row in rows:
              lid = row['legacy_id']
              status = row['status']
              factory = row['factory_decision']
              audit = row['audit_decision']
              notes = row['notes'] or ''

              if status not in allowed_status:
                  invalid.append(f'{lid}: invalid status {status}')

              if audit == 'NOT_APPLICABLE' and factory != 'DISCARD':
                  invalid.append(f'{lid}: NOT_APPLICABLE only allowed with factory DISCARD')
              if factory == 'DISCARD' and audit != 'NOT_APPLICABLE':
                  invalid.append(f'{lid}: factory DISCARD must use NOT_APPLICABLE')

              if audit == 'REJECTED':
                  if status != 'processed_discarded':
                      invalid.append(f'{lid}: REJECTED must resolve to processed_discarded unless audit is updated to APPROVED')
                  if 'ABANDON' not in notes:
                      unresolved.append(lid)

              if audit == 'APPROVED' and 'REJECTED' in notes:
                  if status != 'processed_serialized':
                      invalid.append(f'{lid}: approved regeneration must be processed_serialized')
                  if 'REGENERATE_FROM_ZERO' not in notes:
                      unresolved.append(lid)
                  if not row['v4_item_id'] or not row['v4_item_path']:
                      invalid.append(f'{lid}: approved regeneration missing v4 item linkage')

          if unresolved:
              raise SystemExit('Unresolved REJECTED chains: ' + ', '.join(sorted(set(unresolved))))
          if invalid:
              raise SystemExit('Invalid register rows:\n' + '\n'.join(invalid))

          with path.open('w', encoding='utf-8', newline='') as f:
              writer = csv.DictWriter(f, fieldnames=fields, lineterminator='\n')
              writer.writeheader()
              writer.writerows(rows)

          rejected = [r for r in rows if r['audit_decision'] == 'REJECTED']
          regenerated = [r for r in rows if r['audit_decision'] == 'APPROVED' and 'REJECTED' in (r['notes'] or '')]
          print(f'normalized rows: {changed}')
          print(f'REJECTED resolved by ABANDON: {len(rejected)}')
          print(f'REJECTED resolved by REGENERATE_FROM_ZERO: {len(regenerated)}')
          print('status vocabulary: valid')
          print('NOT_APPLICABLE rule: valid')
          PY

      - name: Commit normalized register to PR branch
        shell: bash
        run: |
          if git diff --quiet -- content/question-bank-v4/legacy-processing-register.csv; then
            echo "No register changes required"
            exit 0
          fi
          git config user.name "gcm-v4-registry-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/question-bank-v4/legacy-processing-register.csv
          git commit -m "fix(question-bank-v4): resolve rejected audit chains"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
