name: V4 phase A5 generate and QA

on:
  push:
    paths:
      - '.github/workflows/v4-phase-a5-generate-qa.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Generate A5 items and validate V4
        shell: bash
        run: |
          python - <<'PY'
          import json, os, glob, collections, sys
          base='content/question-bank-v4/items/docentes'
          items=[
          {"id":"DOC-001242","scope":"general","domain":"gestion_educativa","topic":"gobierno_escolar_participacion","competency":"comprension_conceptual","questionType":"conceptual","cognitiveLevel":"understand","context":"Una institución afirma que su gobierno escolar está conformado por todos los comités, asociaciones y grupos existentes en el colegio, sin distinguir órganos formales de otras instancias de participación.","stem":"¿Cuáles son los órganos que constituyen formalmente el Gobierno Escolar en un establecimiento estatal?","options":{"A":"Rector, Consejo Directivo y Consejo Académico.","B":"Rector, personero estudiantil y asociación de padres.","C":"Consejo de Estudiantes, Comité de Convivencia y Consejo de Padres.","D":"Rector, coordinadores y docentes jefes de área."},"correctAnswer":"A","explanations":{"A":"Es la integración formal prevista por la Ley 115 y el Decreto 1075.","B":"El personero y las asociaciones participan en la vida democrática, pero no sustituyen la estructura formal del Gobierno Escolar.","C":"Son instancias relevantes, pero no constituyen por sí mismas los tres órganos del Gobierno Escolar.","D":"Los coordinadores y jefes de área no reemplazan los órganos definidos por la norma."},"hint":"Distingue órganos del Gobierno Escolar de otras instancias de participación.","learningNote":"En establecimientos estatales el Gobierno Escolar está constituido por Consejo Directivo, Consejo Académico y Rector. Otras instancias fortalecen la participación sin alterar esa estructura básica.","source":{"reference":"Ley 115 de 1994, artículo 142; Decreto 1075 de 2015, artículo 2.3.3.1.5.3"},"estimatedDifficulty":"low"},
          {"id":"DOC-001243","scope":"general","domain":"gestion_educativa","topic":"gobierno_escolar_participacion","competency":"juicio_profesional","questionType":"reasoning","cognitiveLevel":"analyze","context":"La rectoría publica las decisiones ya tomadas y sostiene que con informar al final se cumple plenamente el principio de participación de la comunidad educativa.","stem":"¿Qué falta para una participación seria y responsable?","options":{"A":"Nada, porque participar significa únicamente conocer decisiones consumadas.","B":"Garantizar información suficiente y canales oportunos para que los distintos estamentos puedan presentar iniciativas, sugerencias y deliberar mediante sus representantes antes de las decisiones que les correspondan.","C":"Permitir que cualquier integrante pueda anular individualmente decisiones del gobierno escolar.","D":"Sustituir todos los órganos por consultas informales en redes sociales."},"correctAnswer":"B","explanations":{"A":"La Ley 115 vincula información con participación responsable, no con simple notificación final.","B":"Es la mejor respuesta porque incorpora información, representación e incidencia institucional.","C":"Participación no significa poder de veto individual.","D":"Los canales informales no sustituyen las instancias democráticas previstas."},"hint":"Informar puede ser condición para participar, pero no siempre equivale a participación efectiva.","learningNote":"La comunidad educativa debe recibir información que permita participación seria y responsable. Los voceros de los estamentos pueden presentar sugerencias e iniciativas sobre asuntos institucionales.","source":{"reference":"Ley 115 de 1994, artículo 142"},"estimatedDifficulty":"medium"},
          {"id":"DOC-001244","scope":"general","domain":"normativa_educativa","topic":"gobierno_escolar_participacion","competency":"interpretacion_normativa","questionType":"normative_applied","cognitiveLevel":"apply","context":"Transcurren varios meses del año lectivo y el Consejo Directivo aún no ha sido integrado. La rectoría argumenta que puede conformarlo al final del año porque sus integrantes permanecen hasta ser reemplazados.","stem":"¿Qué criterio normativo debe aplicarse?","options":{"A":"El Consejo puede integrarse en cualquier momento porque no existe plazo alguno.","B":"Debe quedar integrado y entrar en funciones dentro de los primeros sesenta días calendario siguientes al inicio de clases, convocando oportunamente a los estamentos.","C":"Solo debe conformarse cuando exista una decisión financiera pendiente.","D":"Puede reemplazarse por el Consejo Académico mientras no se realicen elecciones."},"correctAnswer":"B","explanations":{"A":"La regulación fija un plazo para su integración anual.","B":"Corresponde al término y procedimiento previstos en el Decreto 1075.","C":"La existencia del Consejo no depende de que aparezca un asunto financiero.","D":"El Consejo Académico no sustituye la integración del Consejo Directivo."},"hint":"La continuidad de los representantes no elimina el deber de organizar oportunamente el nuevo período.","learningNote":"La participación democrática exige organización temprana: el Consejo Directivo debe quedar integrado dentro de los primeros sesenta días calendario desde el inicio de clases.","source":{"reference":"Decreto 1075 de 2015, artículo 2.3.3.1.5.4, parágrafo 2"},"estimatedDifficulty":"medium"},
          {"id":"DOC-001245","scope":"general","domain":"normativa_educativa","topic":"gobierno_escolar_participacion","competency":"interpretacion_normativa","questionType":"case_analysis","cognitiveLevel":"apply","context":"Un estudiante del último grado es elegido personero y, simultáneamente, quiere ocupar la representación de los estudiantes ante el Consejo Directivo porque considera que ambos cargos tienen la misma función.","stem":"¿Cómo debe resolverse la situación?","options":{"A":"Puede ejercer ambos cargos porque toda representación estudiantil es acumulable.","B":"Debe escoger uno, porque el cargo de personero es incompatible con el de representante de los estudiantes ante el Consejo Directivo y sus funciones son distintas.","C":"Solo puede ser representante ante el Consejo Directivo si renuncia a ser estudiante del último grado.","D":"El rector puede autorizar la acumulación mediante resolución interna."},"correctAnswer":"B","explanations":{"A":"La norma establece incompatibilidad expresa.","B":"Es la respuesta correcta y además reconoce que personería y representación ante el Consejo Directivo cumplen papeles diferentes.","C":"Cursar el último grado es precisamente una condición relevante para ambos roles en la regulación.","D":"Una decisión interna no puede dejar sin efecto la incompatibilidad reglamentaria."},"hint":"Representar derechos y representar al estudiantado en un órgano directivo no son el mismo cargo.","learningNote":"El personero promueve derechos y deberes, recibe quejas y formula solicitudes; su cargo es incompatible con el de representante estudiantil ante el Consejo Directivo.","source":{"reference":"Decreto 1075 de 2015, artículo 2.3.3.1.5.11"},"estimatedDifficulty":"medium"},
          {"id":"DOC-001246","scope":"general","domain":"gestion_educativa","topic":"gobierno_escolar_participacion","competency":"comprension_conceptual","questionType":"reading_analysis","cognitiveLevel":"analyze","context":"El Consejo de Estudiantes es tratado como un grupo encargado solo de organizar celebraciones. Cuando presenta propuestas sobre la vida escolar, se le responde que carece de funciones institucionales relevantes.","stem":"¿Qué interpretación corrige mejor esa visión?","options":{"A":"El Consejo de Estudiantes es el máximo órgano colegiado que asegura el ejercicio continuo de la participación estudiantil y, entre otras funciones, elige al representante de los estudiantes ante el Consejo Directivo.","B":"Su única función normativa es organizar actividades recreativas.","C":"Es un órgano asesor del rector sin capacidad de iniciativa propia.","D":"Solo puede reunirse cuando el personero lo convoque."},"correctAnswer":"A","explanations":{"A":"Recoge el papel institucional definido por la regulación.","B":"Reduce indebidamente el alcance de la participación estudiantil.","C":"El Consejo tiene organización y funciones propias.","D":"La norma no limita su funcionamiento a convocatorias del personero."},"hint":"Busca la instancia diseñada para garantizar participación estudiantil continua.","learningNote":"El Consejo de Estudiantes no es un comité de eventos; es la instancia colegiada que garantiza participación y representación de los educandos en la vida institucional.","source":{"reference":"Decreto 1075 de 2015, artículo 2.3.3.1.5.12"},"estimatedDifficulty":"low"},
          {"id":"DOC-001247","scope":"general","domain":"gestion_educativa","topic":"gobierno_escolar_participacion","competency":"resolucion_de_problemas","questionType":"case_analysis","cognitiveLevel":"analyze","context":"Un grupo de estudiantes propone crear un medio digital escolar para debatir temas de interés académico y comunitario. La institución rechaza la iniciativa sin revisarla porque 'los estudiantes no participan en decisiones institucionales'.","stem":"¿Cuál respuesta se ajusta mejor al marco de participación democrática?","options":{"A":"Rechazarla automáticamente porque las iniciativas institucionales solo pueden provenir de adultos.","B":"Canalizar la propuesta por las instancias de representación y valorar su coherencia con el PEI, el manual y las competencias de los órganos correspondientes, permitiendo deliberación real.","C":"Autorizarla sin ninguna regla porque toda iniciativa estudiantil es obligatoria para la institución.","D":"Exigir que la propuesta sea presentada exclusivamente por una entidad externa."},"correctAnswer":"B","explanations":{"A":"La Ley 115 reconoce iniciativas estudiantiles en la vida escolar.","B":"Es la respuesta que combina participación con procedimientos y competencias institucionales.","C":"Participación no convierte toda iniciativa en decisión automática.","D":"No se requiere patrocinio externo para ejercer participación estudiantil."},"hint":"La participación efectiva necesita canales y reglas, no rechazo automático ni aprobación automática.","learningNote":"El gobierno escolar debe considerar iniciativas de los estudiantes en asuntos de la vida institucional. Participar significa poder proponer y deliberar dentro de procedimientos democráticos.","source":{"reference":"Ley 115 de 1994, artículo 142; Decreto 1075 de 2015, artículos 2.3.3.1.5.11 y 2.3.3.1.5.12"},"estimatedDifficulty":"medium"},
          {"id":"DOC-001248","scope":"general","domain":"normativa_educativa","topic":"gobierno_escolar_participacion","competency":"interpretacion_normativa","questionType":"reasoning","cognitiveLevel":"analyze","context":"El rector recibe una decisión válida del Consejo Directivo y afirma que puede ignorarla porque, como representante legal del establecimiento, el gobierno escolar tiene únicamente carácter consultivo.","stem":"¿Qué error contiene esa afirmación?","options":{"A":"Ninguno, porque el rector nunca está obligado por decisiones del gobierno escolar.","B":"El rector es uno de los órganos del Gobierno Escolar y le corresponde orientar la ejecución del PEI y aplicar las decisiones del gobierno escolar dentro del marco de sus competencias.","C":"El Consejo Directivo sustituye por completo al rector en la administración diaria.","D":"Las decisiones del gobierno escolar solo obligan cuando las ratifica el personero."},"correctAnswer":"B","explanations":{"A":"Desconoce las funciones expresas del rector en la organización institucional.","B":"Es la interpretación correcta de su papel como ejecutor de las decisiones del gobierno escolar.","C":"La participación colegiada no elimina las funciones propias del rector.","D":"El personero no ratifica decisiones del Gobierno Escolar."},"hint":"Gobierno colegiado y dirección ejecutiva cumplen funciones complementarias.","learningNote":"El rector representa al establecimiento ante autoridades educativas y ejecuta las decisiones del gobierno escolar; su liderazgo no convierte los órganos colegiados en instancias decorativas.","source":{"reference":"Decreto 1075 de 2015, artículos 2.3.3.1.5.3 y 2.3.3.1.5.8"},"estimatedDifficulty":"medium"},
          {"id":"DOC-001249","scope":"general","domain":"gestion_educativa","topic":"gobierno_escolar_participacion","competency":"juicio_profesional","questionType":"technical_applied","cognitiveLevel":"apply","context":"Una institución quiere fortalecer la participación, pero concentra todas las consultas en una encuesta anual sin devolver resultados ni conectar las respuestas con representantes, consejos o decisiones posteriores.","stem":"¿Qué diseño sería más sólido?","options":{"A":"Mantener la encuesta como único mecanismo porque una medición anual equivale a gobierno democrático.","B":"Combinar información accesible, elección y funcionamiento de representantes, espacios de deliberación, recepción de iniciativas y devolución sobre cómo fueron consideradas en las decisiones competentes.","C":"Eliminar los órganos formales y reemplazarlos por sondeos digitales permanentes.","D":"Restringir la información para evitar que la comunidad influya en asuntos técnicos."},"correctAnswer":"B","explanations":{"A":"La consulta sin incidencia ni retorno es insuficiente para una participación institucional robusta.","B":"Integra representación, información, deliberación e incidencia dentro de las competencias formales.","C":"Los sondeos pueden complementar, no sustituir la estructura del gobierno escolar.","D":"La participación responsable exige información, no opacidad."},"hint":"La participación de calidad conecta voz, representación, decisión y retroalimentación.","learningNote":"La democracia escolar no se agota en votar o responder encuestas. Requiere información, representación, deliberación, canales de iniciativa y trazabilidad de las decisiones.","source":{"reference":"Ley 115 de 1994, artículo 142; Decreto 1075 de 2015, Sección 5 sobre Gobierno Escolar"},"estimatedDifficulty":"medium"}
          ]
          for d in items:
              p=f"{base}/{d['id']}.json"
              if os.path.exists(p):raise SystemExit('already exists '+p)
              with open(p,'w',encoding='utf-8') as f:json.dump(d,f,ensure_ascii=False,indent=2);f.write('\n')
          def sp(pairs):
              d={}
              for k,v in pairs:
                  if k in d:raise ValueError('duplicate '+k)
                  d[k]=v
              return d
          def load(p):
              with open(p,encoding='utf-8') as f:return json.load(f,object_pairs_hook=sp)
          domains=load('content/question-bank-v4/taxonomy/domains.json');topics=load('content/question-bank-v4/taxonomy/topics.json');comps=load('content/question-bank-v4/taxonomy/competencies.json');qt=load('content/question-bank-v4/taxonomy/question-types.json');allowed={'domain':set(domains),'topic':set(topics),'competency':set(comps),'questionType':set(qt['questionTypes']),'cognitiveLevel':set(qt['cognitiveLevels']),'estimatedDifficulty':set(qt['estimatedDifficultyLevels'])};req={'id','scope','domain','topic','competency','questionType','cognitiveLevel','context','stem','options','correctAnswer','explanations','hint','learningNote','source','estimatedDifficulty'}
          errs=[];ids=[];counters={k:collections.Counter() for k in allowed};files=sorted(glob.glob(base+'/*.json'))
          for p in files:
              try:d=load(p)
              except Exception as e:errs.append(f'{p}: {e}');continue
              ids.append(d.get('id'))
              if set(d)!=req:errs.append(f'{p}: keys')
              for k,v in allowed.items():
                  if d.get(k) not in v:errs.append(f'{p}: invalid {k}')
                  counters[k][d.get(k)]+=1
              if set(d.get('options',{}))!={'A','B','C','D'} or set(d.get('explanations',{}))!={'A','B','C','D'}:errs.append(f'{p}: A-D')
              if d.get('correctAnswer') not in {'A','B','C','D'}:errs.append(f'{p}: answer')
          if len(ids)!=len(set(ids)):errs.append('duplicate ids')
          expected=[f'DOC-{i:06d}' for i in range(1242,1250)]
          for x in expected:
              if x not in ids:errs.append('missing '+x)
          cov={'domains':{k:counters['domain'][k] for k in domains},'topics':{k:counters['topic'][k] for k in topics},'competencies':{k:counters['competency'][k] for k in comps},'questionTypes':{k:counters['questionType'][k] for k in qt['questionTypes']},'cognitiveLevels':{k:counters['cognitiveLevel'][k] for k in qt['cognitiveLevels']},'estimatedDifficulty':{k:counters['estimatedDifficulty'][k] for k in qt['estimatedDifficultyLevels']}}
          report={'generatedAt':'2026-08-22','batch':'DOC-PHASE-A5-20260822','itemCount':len(files),'batchIds':expected,'errors':errs,'coverage':cov}
          with open('content/question-bank-v4/COVERAGE-AFTER-PHASE-A5-20260822.json','w',encoding='utf-8') as f:json.dump(report,f,ensure_ascii=False,indent=2);f.write('\n')
          print(json.dumps(report,ensure_ascii=False,indent=2))
          if errs:sys.exit(1)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content/question-bank-v4/items/docentes content/question-bank-v4/COVERAGE-AFTER-PHASE-A5-20260822.json
          git commit -m 'feat(v4): add phase A5 government participation items'
          git pull --rebase origin master
          git push origin HEAD:master
