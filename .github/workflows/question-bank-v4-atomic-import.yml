name: Question Bank V4 clean sync

on:
  push:
    branches: [master]
    paths:
      - 'content/question-bank-v4/**'
      - 'content/targeting/**'
      - 'content/knowledge-base/**'
      - 'scripts/content-sync.ts'
      - 'scripts/lib/content-sync-*.ts'
      - 'scripts/lib/v4-import-plan.ts'
      - 'scripts/*content-sync*.test.ts'
      - 'scripts/test-content-sync-db.ts'
      - 'scripts/test-v4-runtime-db.ts'
      - 'supabase/migrations/**'
      - 'supabase/seed.sql'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/question-bank-v4-atomic-import.yml'
  pull_request:
    branches: [master]
    paths:
      - 'content/question-bank-v4/**'
      - 'content/targeting/**'
      - 'content/knowledge-base/**'
      - 'scripts/content-sync.ts'
      - 'scripts/lib/content-sync-*.ts'
      - 'scripts/lib/v4-import-plan.ts'
      - 'scripts/*content-sync*.test.ts'
      - 'scripts/test-content-sync-db.ts'
      - 'scripts/test-v4-runtime-db.ts'
      - 'supabase/migrations/**'
      - 'supabase/seed.sql'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/question-bank-v4-atomic-import.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-database:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Start isolated Supabase
        run: npx supabase start
      - name: Rebuild from all versioned migrations
        run: npx supabase db reset --local
      - name: Test question-bank security boundary
        run: npm run test:security
      - name: Test clean V4 sync
        run: npm run test:v4-import:db
      - name: Test V4 runtime contracts
        run: npm run test:v4-runtime:db
      - name: Stop isolated Supabase
        if: always()
        run: npx supabase stop --no-backup
