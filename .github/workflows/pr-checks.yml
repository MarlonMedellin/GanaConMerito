name: PR Checks

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

concurrency:
  group: pr-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build, test, and runtime smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      CI: true
      NEXT_PUBLIC_APP_COMMIT: ${{ github.sha }}
      NEXT_PUBLIC_APP_BUILD_TIME: ${{ github.event.pull_request.updated_at || github.event.head_commit.timestamp }}
      PORT: 3000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate console runners
        run: bash runner/gcm-runner-selftest.sh

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start isolated Supabase
        run: npx supabase start

      - name: Rebuild from all versioned migrations
        run: npx supabase db reset --local

      - name: Advisory documentation trigger review
        run: npm run check:doc-triggers
        continue-on-error: true

      - name: Validate active content
        run: npm run content:validate

      - name: Validate knowledge and targeting catalogs
        run: npm run content:validate:knowledge-targeting

      - name: Inventory V4 source references
        run: npm run content:inventory:v4-sources

      - name: Run lint
        run: npm run lint

      - name: Run unit tests
        run: npm test

      - name: Stop isolated Supabase
        if: always()
        run: npx supabase stop --no-backup

      - name: Build
        run: npm run build

      - name: Verify production start and health
        run: |
          npm run start &
          APP_PID=$!
          trap "kill $APP_PID" EXIT
          for i in {1..30}; do
            if curl -fsS "http://127.0.0.1:${PORT}/icon.svg" >/dev/null; then
              echo "Production server responded on ${PORT}"
              exit 0
            fi
            sleep 2
          done
          echo "App failed to become ready in time" >&2
          exit 1

  docker-build:
    name: Container build reproducibility
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            --build-arg APP_COMMIT="${GITHUB_SHA}" \
            --build-arg APP_BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -t gcm-app:ci .
