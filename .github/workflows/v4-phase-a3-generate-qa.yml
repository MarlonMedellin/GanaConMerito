name: V4 phase A3 generate and QA

on:
  push:
    paths:
      - '.github/workflows/v4-phase-a3-generate-qa.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Generate A3 items and validate V4
        shell: bash
        run: |
          python - <<'PY'
          import json, os, glob, collections, sys
          base='content/question-bank-v4/items/docentes'
          items=[
          {"id":"DOC-001224","scope":"general","domain":"normativa_educativa","topic":"funciones_y_jornada_docente","competency":"comprension_conceptual","questionType":"conceptual","cognitiveLevel":"understand","context":"En una reunión se usan como sinónimos 'jornada escolar', 'asignación académica' y 'jornada laboral docente', lo que genera errores al organizar horarios.","stem":"¿Cuál distinción es correcta?","options":{"A":"La jornada escolar es el tiempo del servicio educativo para estudiantes; la asignación académica es el tiempo de atención directa del docente a estudiantes; la jornada laboral comprende las funciones propias del cargo, incluida la asignación y actividades complementarias.","B":"Los tres conceptos significan exactamente el número de clases semanales que aparecen en el horario del docente.","C":"La jornada laboral corresponde solo al tiempo dentro del aula y la asignación académica incluye reuniones y planeación.","D":"La jornada escolar se refiere exclusivamente al horario de los docentes y la jornada laboral al horario de los estudiantes."},"correctAnswer":"A","explanations":{"A":"Distingue correctamente el tiempo del servicio al estudiante, la atención directa y el conjunto de funciones laborales.","B":"Confunde categorías normativas con finalidades distintas.","C":"Invierte el alcance de la asignación académica y de las actividades complementarias.","D":"Intercambia los sujetos y finalidades de los conceptos."},"hint":"Pregunta quién usa cada tiempo y para qué.","learningNote":"Jornada escolar, asignación académica y jornada laboral se relacionan, pero no son equivalentes. La organización institucional debe respetar la finalidad normativa de cada una.","source":{"reference":"Decreto 1075 de 2015, artículos 2.4.3.1.1 y 2.4.3.3.1; Decreto 277 de 2025, artículos 1, 2 y 3"},"estimatedDifficulty":"low"},
          {"id":"DOC-001225","scope":"general","domain":"gestion_educativa","topic":"funciones_y_jornada_docente","competency":"planeacion_pedagogica","questionType":"technical_applied","cognitiveLevel":"apply","context":"Antes de iniciar el año lectivo, una institución copia el horario escolar del año anterior sin revisar el PEI, el plan de estudios ni el calendario académico actualizado.","stem":"¿Qué debe hacer el rector o director para definir válidamente el horario de la jornada escolar?","options":{"A":"Adoptar el horario anterior porque la continuidad institucional prevalece sobre cualquier otro criterio.","B":"Definirlo al comienzo del año lectivo conforme a las normas vigentes, el PEI, el plan de estudios y el calendario académico de la entidad territorial.","C":"Dejar que cada docente determine de manera independiente su horario de atención a estudiantes.","D":"Someter todas las horas de clase a votación de los estudiantes antes de incorporarlas al plan de estudios."},"correctAnswer":"B","explanations":{"A":"El horario debe responder a las condiciones vigentes y al proyecto institucional, no a una copia automática.","B":"Es la actuación prevista por la regulación actual.","C":"La definición institucional del horario corresponde al rector o director, no a decisiones individuales inconexas.","D":"La participación estudiantil es valiosa, pero no sustituye la competencia de organización del horario."},"hint":"El horario debe derivarse del marco institucional vigente, no de una rutina histórica.","learningNote":"El rector o director define el horario al comienzo de cada año lectivo, en coherencia con normas, PEI, plan de estudios y calendario académico.","source":{"reference":"Decreto 277 de 2025, artículo 1, que modifica el artículo 2.4.3.1.2 del Decreto 1075 de 2015"},"estimatedDifficulty":"medium"},
          {"id":"DOC-001226","scope":"general","domain":"normativa_educativa","topic":"funciones_y_jornada_docente","competency":"resolucion_de_problemas","questionType":"reasoning","cognitiveLevel":"apply","context":"Una institución asigna 22 horas semanales de atención directa a todos los docentes, incluidos preescolar y básica primaria, porque considera que esa cifra es uniforme para cualquier nivel.","stem":"¿Qué ajuste exige el Decreto 277 de 2025?","options":{"A":"Mantener 22 horas para todos porque la asignación académica es idéntica en cualquier nivel.","B":"Asignar 20 horas en preescolar, 25 en básica primaria y 22 en básica secundaria y media, salvo las flexibilidades expresamente previstas cuando existan docentes de especialidad en preescolar o primaria.","C":"Asignar 30 horas a todos los docentes porque esa es la jornada escolar mínima de secundaria.","D":"Eliminar cualquier referencia semanal y permitir que cada área decida libremente su asignación académica."},"correctAnswer":"B","explanations":{"A":"La reforma diferenció expresamente la asignación académica por nivel.","B":"Corresponde a la distribución vigente y reconoce la excepción prevista para preescolar y primaria con docentes de especialidad.","C":"Confunde intensidad de la jornada escolar del estudiante con asignación académica docente.","D":"La autonomía institucional no elimina los mínimos y reglas normativas."},"hint":"No confundas intensidad escolar del estudiante con tiempo de atención directa del docente.","learningNote":"Desde el Decreto 277 de 2025, la asignación académica semanal se diferencia por nivel: 20 horas en preescolar, 25 en primaria y 22 en secundaria y media.","source":{"reference":"Decreto 277 de 2025, artículo 2, artículo 2.4.3.2.1 del Decreto 1075 de 2015"},"estimatedDifficulty":"medium"},
          {"id":"DOC-001227","scope":"general","domain":"gestion_educativa","topic":"funciones_y_jornada_docente","competency":"decision_pedagogica","questionType":"case_analysis","cognitiveLevel":"analyze","context":"La institución decide que durante el descanso pedagógico todos los docentes quedan completamente liberados de cualquier responsabilidad institucional porque 'no es tiempo escolar ni laboral'.","stem":"¿Qué interpretación se ajusta al Decreto 277 de 2025?","options":{"A":"El descanso pedagógico queda fuera de la jornada escolar y de la jornada laboral presencial.","B":"El descanso pedagógico forma parte de la jornada escolar, de la jornada laboral presencial y de los periodos de clase según la organización institucional, con el propósito de promover bienestar y acompañamiento.","C":"Solo hace parte de la jornada laboral de coordinadores y orientadores.","D":"Es una actividad extracurricular voluntaria que cada docente puede aceptar o rechazar."},"correctAnswer":"B","explanations":{"A":"La reforma incorporó expresamente el descanso pedagógico dentro de estos tiempos.","B":"Es la interpretación vigente y reconoce su carácter pedagógico y de bienestar.","C":"La regla no se limita a esos cargos.","D":"No se configura como actividad extracurricular voluntaria."},"hint":"La reforma de 2025 resignificó expresamente el descanso pedagógico.","learningNote":"El descanso pedagógico se integra a la organización de la jornada y busca bienestar integral; su distribución debe responder a la organización escolar y a las responsabilidades institucionales.","source":{"reference":"Decreto 277 de 2025, artículos 1, 2 y 3"},"estimatedDifficulty":"medium"},
          {"id":"DOC-001228","scope":"general","domain":"normativa_educativa","topic":"funciones_y_jornada_docente","competency":"comprension_conceptual","questionType":"reading_analysis","cognitiveLevel":"analyze","context":"Un docente afirma que reuniones con familias, preparación de clases, evaluación, planeación, actividades culturales, investigación y actualización profesional son tareas voluntarias porque no corresponden a atención directa de estudiantes.","stem":"¿Qué error contiene ese razonamiento?","options":{"A":"Ninguno, porque la jornada laboral docente se agota en la asignación académica.","B":"Confunde asignación académica con jornada laboral: la jornada incluye atención directa y actividades curriculares complementarias propias del cargo.","C":"Esas actividades corresponden exclusivamente al coordinador y al rector.","D":"Solo la investigación y la actualización hacen parte de la jornada laboral; las demás son voluntarias."},"correctAnswer":"B","explanations":{"A":"La jornada laboral tiene un alcance más amplio que la atención directa de estudiantes.","B":"Es la distinción correcta entre asignación académica y actividades curriculares complementarias.","C":"Muchas de esas actividades forman parte ordinaria de las funciones docentes.","D":"La regulación enumera un conjunto más amplio de actividades complementarias."},"hint":"Que una actividad no sea clase directa no significa que quede fuera de las funciones del cargo.","learningNote":"La jornada laboral docente comprende asignación académica y actividades curriculares complementarias como preparación, evaluación, planeación, disciplina, reuniones, orientación, atención a la comunidad, investigación y actualización.","source":{"reference":"Decreto 1075 de 2015, artículo 2.4.3.3.1; Decreto 277 de 2025, consideraciones y artículo 3"},"estimatedDifficulty":"medium"},
          {"id":"DOC-001229","scope":"general","domain":"normativa_educativa","topic":"funciones_y_jornada_docente","competency":"interpretacion_normativa","questionType":"normative_applied","cognitiveLevel":"apply","context":"A un docente orientador se le exige permanecer ocho horas continuas diarias dentro del establecimiento, sin posibilidad de desarrollar fuera de la institución ninguna actividad propia del cargo.","stem":"¿Cómo debe analizarse esa exigencia bajo el Decreto 277 de 2025?","options":{"A":"Es correcta porque todo servidor docente debe permanecer físicamente ocho horas continuas en la institución.","B":"Debe revisarse: para docentes orientadores y de apoyo pedagógico se prevén seis horas diarias continuas de permanencia según la planeación institucional y dos horas restantes desarrolladas autónomamente en actividades propias del cargo.","C":"Es incorrecta porque el orientador solo tiene una jornada de seis horas totales.","D":"Es correcta únicamente si la aprueba el Consejo de Estudiantes."},"correctAnswer":"B","explanations":{"A":"La jornada laboral total es de ocho horas, pero la norma diferencia la permanencia para orientadores y apoyo pedagógico.","B":"Es la regla específica vigente.","C":"Las seis horas se refieren a permanencia continua, no a la totalidad de la jornada laboral.","D":"La competencia no depende de aprobación estudiantil."},"hint":"Distingue duración total de la jornada y tiempo de permanencia continua.","learningNote":"La reforma mantiene una jornada laboral de ocho horas, pero para orientadores y apoyo pedagógico establece seis horas continuas de permanencia y dos horas autónomas para actividades propias del cargo.","source":{"reference":"Decreto 277 de 2025, artículo 3, parágrafo 2 del artículo 2.4.3.3.3 del Decreto 1075 de 2015"},"estimatedDifficulty":"medium"},
          {"id":"DOC-001230","scope":"general","domain":"normativa_educativa","topic":"funciones_y_jornada_docente","competency":"interpretacion_normativa","questionType":"case_analysis","cognitiveLevel":"judge","context":"En un colegio con jornada de mañana y tarde, se programa a una docente de aula tres horas en la mañana y tres en la tarde, obligándola a permanecer nueve horas entre la primera y la última actividad, aunque su asignación académica no cambia.","stem":"¿Qué aspecto debe corregirse?","options":{"A":"Ninguno, porque en colegios con dos jornadas la permanencia puede fragmentarse y extenderse indefinidamente.","B":"La permanencia continua debe desarrollarse en la mañana o en la tarde y, aun ante necesidades especiales del servicio, no puede prolongarse el tiempo de permanencia institucional ni afectarse la asignación académica.","C":"La docente debe asumir ambas jornadas completas si el rector lo dispone verbalmente.","D":"La única solución válida es reducir a cuatro horas su jornada laboral total."},"correctAnswer":"B","explanations":{"A":"La reforma precisamente evita que la existencia de dos jornadas prolongue la permanencia institucional.","B":"Es la regla específica del Decreto 277 para establecimientos con dos jornadas.","C":"La distribución de funciones está sometida a límites normativos.","D":"La jornada laboral total no se reduce a cuatro horas."},"hint":"La existencia de dos jornadas escolares no autoriza extender indefinidamente la permanencia del docente.","learningNote":"En establecimientos con dos jornadas, las seis horas continuas de permanencia se desarrollan en la mañana o en la tarde; la organización no puede prolongar el tiempo de permanencia ni afectar la asignación académica.","source":{"reference":"Decreto 277 de 2025, artículo 3, parágrafo 3 del artículo 2.4.3.3.3 del Decreto 1075 de 2015"},"estimatedDifficulty":"high"},
          {"id":"DOC-001231","scope":"general","domain":"gestion_educativa","topic":"funciones_y_jornada_docente","competency":"interpretacion_normativa","questionType":"normative_applied","cognitiveLevel":"apply","context":"Al comenzar el año, un grupo de docentes decide por votación cómo repartirse las asignaciones académicas y demás funciones, y comunica al rector que su decisión es obligatoria.","stem":"¿Quién tiene la competencia para realizar esa distribución?","options":{"A":"La asamblea de docentes, porque la distribución de funciones es una decisión colegiada exclusiva.","B":"El rector, a quien la Ley 715 atribuye distribuir las asignaciones académicas y demás funciones de docentes, directivos y administrativos conforme a las normas aplicables.","C":"El personero estudiantil, porque representa a los estudiantes afectados por el horario.","D":"La secretaría de educación debe elaborar directamente cada horario individual del establecimiento."},"correctAnswer":"B","explanations":{"A":"La participación del equipo no desplaza la competencia legal atribuida al rector.","B":"Es la competencia prevista expresamente por la Ley 715.","C":"El personero tiene funciones de promoción y defensa de derechos estudiantiles, no de distribución de cargas laborales.","D":"La entidad territorial regula y administra el servicio, pero la distribución interna corresponde al rector dentro del marco normativo."},"hint":"Distingue participación institucional de competencia formal para asignar funciones.","learningNote":"La distribución de asignaciones académicas y demás funciones del personal a cargo es una responsabilidad del rector, que debe ejercerse conforme a las normas y al proyecto institucional.","source":{"reference":"Ley 715 de 2001, artículo 10, numeral 10.9"},"estimatedDifficulty":"medium"},
          {"id":"DOC-001232","scope":"general","domain":"gestion_educativa","topic":"funciones_y_jornada_docente","competency":"resolucion_de_problemas","questionType":"reasoning","cognitiveLevel":"analyze","context":"La rectoría reorganiza los periodos de clase y el descanso pedagógico sin informar ni consultar a ninguna instancia, aunque el cambio afecta la distribución institucional de la jornada.","stem":"¿Qué mejora fortalece la legalidad y gobernanza de la decisión?","options":{"A":"Mantener la decisión unilateral porque toda distribución del tiempo es una potestad sin consulta.","B":"Distribuir estos tiempos por decisión del rector o director en consulta con el Consejo Directivo y el Consejo Académico, de acuerdo con el plan de estudios y las particularidades del establecimiento.","C":"Delegar la decisión al Consejo de Estudiantes porque es el único órgano que representa a quienes reciben clases.","D":"Solicitar autorización individual escrita a cada familia para cada periodo de clase."},"correctAnswer":"B","explanations":{"A":"El Decreto 277 incorpora expresamente la consulta con órganos del gobierno escolar para esta distribución.","B":"Es la solución que articula competencia directiva y consulta institucional.","C":"El Consejo de Estudiantes tiene otras funciones y no sustituye a los órganos previstos para esta consulta.","D":"La organización general del horario no depende de autorizaciones individuales de cada familia."},"hint":"La competencia del rector no elimina los espacios de consulta que la regulación exige.","learningNote":"La organización de jornada, permanencia y periodos de clase, incluido el descanso pedagógico, debe articular dirección institucional y consulta con Consejo Directivo y Consejo Académico.","source":{"reference":"Decreto 277 de 2025, artículo 2, parágrafo del artículo 2.4.3.2.1 del Decreto 1075 de 2015"},"estimatedDifficulty":"medium"},
          {"id":"DOC-001233","scope":"general","domain":"gestion_educativa","topic":"funciones_y_jornada_docente","competency":"planeacion_pedagogica","questionType":"technical_applied","cognitiveLevel":"apply","context":"El docente orientador inicia el año sin un plan propio porque considera que basta con atender espontáneamente los casos que lleguen a su oficina. No existen objetivos, actividades ni criterios de seguimiento de orientación escolar.","stem":"¿Qué acción se ajusta mejor a su función institucional?","options":{"A":"Limitarse a responder casos individuales, porque la orientación escolar no requiere planeación anual.","B":"Diseñar y evaluar el Plan Operativo Anual de Orientación Escolar a partir de la caracterización institucional y articularlo con la planeación y gestión del establecimiento.","C":"Sustituir el PEI por un plan clínico individual para cada estudiante.","D":"Delegar toda la orientación escolar en docentes de aula y concentrarse únicamente en reportes administrativos."},"correctAnswer":"B","explanations":{"A":"El manual de funciones asigna al orientador responsabilidades explícitas de planeación y evaluación anual.","B":"Es la actuación prevista y permite pasar de una atención reactiva a una orientación institucional planificada.","C":"El orientador participa en el PEI y otros instrumentos, no los reemplaza por planes clínicos.","D":"La orientación escolar es una función propia que se articula con otros actores, no se transfiere íntegramente."},"hint":"El rol del orientador combina atención de casos con planeación institucional preventiva.","learningNote":"El docente orientador participa en la planeación institucional y debe diseñar y evaluar un Plan Operativo Anual de Orientación Escolar sustentado en la caracterización y las necesidades del establecimiento.","source":{"reference":"Resolución MEN 003842 de 2022, anexo técnico, numeral 2.2.3, funciones 1 y 2 del docente orientador"},"estimatedDifficulty":"medium"}
          ]
          for d in items:
              p=f"{base}/{d['id']}.json"
              if os.path.exists(p): raise SystemExit(f'already exists: {p}')
              with open(p,'w',encoding='utf-8') as f: json.dump(d,f,ensure_ascii=False,indent=2); f.write('\n')
          def sp(pairs):
              d={}
              for k,v in pairs:
                  if k in d: raise ValueError('duplicate key '+k)
                  d[k]=v
              return d
          def load(p):
              with open(p,encoding='utf-8') as f:return json.load(f,object_pairs_hook=sp)
          domains=load('content/question-bank-v4/taxonomy/domains.json'); topics=load('content/question-bank-v4/taxonomy/topics.json'); comps=load('content/question-bank-v4/taxonomy/competencies.json'); qt=load('content/question-bank-v4/taxonomy/question-types.json')
          allowed={'domain':set(domains),'topic':set(topics),'competency':set(comps),'questionType':set(qt['questionTypes']),'cognitiveLevel':set(qt['cognitiveLevels']),'estimatedDifficulty':set(qt['estimatedDifficultyLevels'])}; req={'id','scope','domain','topic','competency','questionType','cognitiveLevel','context','stem','options','correctAnswer','explanations','hint','learningNote','source','estimatedDifficulty'}
          errs=[]; ids=[]; counters={k:collections.Counter() for k in allowed}; files=sorted(glob.glob(base+'/*.json'))
          for p in files:
              try:d=load(p)
              except Exception as e:errs.append(f'{p}: {e}');continue
              ids.append(d.get('id'))
              if set(d)!=req:errs.append(f'{p}: keys mismatch')
              if d.get('scope')!='general':errs.append(f'{p}: scope')
              for k,v in allowed.items():
                  if d.get(k) not in v:errs.append(f'{p}: invalid {k}={d.get(k)}')
                  counters[k][d.get(k)]+=1
              if set(d.get('options',{}))!={'A','B','C','D'}:errs.append(f'{p}: options')
              if set(d.get('explanations',{}))!={'A','B','C','D'}:errs.append(f'{p}: explanations')
              if d.get('correctAnswer') not in {'A','B','C','D'}:errs.append(f'{p}: answer')
              if set(d.get('source',{}))!={'reference'} or not d['source']['reference'].strip():errs.append(f'{p}: source')
          if len(ids)!=len(set(ids)):errs.append('duplicate ids')
          expected=[f'DOC-{i:06d}' for i in range(1224,1234)]
          for x in expected:
              if x not in ids:errs.append('missing '+x)
          cov={'domains':{k:counters['domain'][k] for k in domains},'topics':{k:counters['topic'][k] for k in topics},'competencies':{k:counters['competency'][k] for k in comps},'questionTypes':{k:counters['questionType'][k] for k in qt['questionTypes']},'cognitiveLevels':{k:counters['cognitiveLevel'][k] for k in qt['cognitiveLevels']},'estimatedDifficulty':{k:counters['estimatedDifficulty'][k] for k in qt['estimatedDifficultyLevels']}}
          report={'generatedAt':'2026-08-22','batch':'DOC-PHASE-A3-20260822','itemCount':len(files),'batchIds':expected,'errors':errs,'coverage':cov}
          with open('content/question-bank-v4/COVERAGE-AFTER-PHASE-A3-20260822.json','w',encoding='utf-8') as f:json.dump(report,f,ensure_ascii=False,indent=2);f.write('\n')
          print(json.dumps(report,ensure_ascii=False,indent=2))
          if errs:sys.exit(1)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content/question-bank-v4/items/docentes content/question-bank-v4/COVERAGE-AFTER-PHASE-A3-20260822.json
          git commit -m 'feat(v4): add phase A3 functions and jornada items'
          git pull --rebase origin master
          git push origin HEAD:master
