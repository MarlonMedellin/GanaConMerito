name: Question Bank Review Pages

on:
  push:
    branches:
      - web_review_question
    paths:
      - 'content/review/**'
      - 'content/question-bank-v4/items/**'
      - '.github/workflows/question-review-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: question-review-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload review site
        uses: actions/upload-pages-artifact@v3
        with:
          path: content/review

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
