name: Canary V4 plan artifact

on:
  pull_request:
    branches: [master]
  push:
    branches:
      - canary/supabase-v4-candidate-plan-20260823

permissions:
  contents: read

jobs:
  build-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 84b32e143becebe531769106dc9d27ceddd75e4a
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate canonical plan from frozen master SHA
        run: |
          npx tsx -e '(async () => { const imported = await import("./scripts/lib/content-sync-plan.ts"); const api = imported.default ?? imported; const plan = await api.buildContentSyncPlan(process.cwd()); const planHash = api.calculateContentSyncPlanHash(plan); const { writeFileSync } = await import("node:fs"); writeFileSync("content-sync-plan.json", JSON.stringify({planHash, plan}, null, 2)); console.log(JSON.stringify({gitSha: plan.gitSha, planHash, counts: Object.fromEntries(Object.entries(plan.entities).map(([k,v]) => [k,v.length]))})); })()'
      - uses: actions/upload-artifact@v4
        with:
          name: canary-v4-content-sync-plan
          path: content-sync-plan.json
          if-no-files-found: error
          retention-days: 1
      - name: Apply canonical plan to isolated Canary candidate
        run: |
          curl --fail-with-body --silent --show-error "https://dhiytzbwodfvdrnwhkcw.supabase.co/functions/v1/gcm-canary-sync-once?token=gcm-canary-sync-20260823-f31a5832-38bb0d3a"
