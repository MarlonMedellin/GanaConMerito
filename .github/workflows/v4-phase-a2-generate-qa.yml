name: V4 phase A2 generate and QA

on:
  push:
    paths:
      - '.github/workflows/v4-phase-a2-generate-qa.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Generate A2 items and validate V4
        shell: bash
        run: |
          python - <<'PY'
          import json, os, glob, collections, sys
          base='content/question-bank-v4/items/docentes'
          items=[
          {"id":"DOC-001214","scope":"general","domain":"normativa_educativa","topic":"proteccion_integral","competency":"comprension_conceptual","questionType":"conceptual","cognitiveLevel":"understand","context":"En una capacitación institucional se afirma que el PARD es una sanción que puede imponer el colegio cuando un estudiante o su familia incumplen deberes escolares.","stem":"¿Cuál definición corrige mejor esa afirmación?","options":{"A":"El PARD es un proceso disciplinario interno del colegio para sancionar a estudiantes y acudientes.","B":"El PARD es el conjunto de actuaciones administrativas o judiciales orientadas a restaurar derechos de niños, niñas y adolescentes amenazados o vulnerados, adelantadas por las autoridades competentes.","C":"El PARD es una estrategia pedagógica voluntaria que solo se activa cuando la familia solicita acompañamiento.","D":"El PARD es una investigación penal que siempre concluye con una denuncia ante Fiscalía."},"correctAnswer":"B","explanations":{"A":"Confunde protección de derechos con disciplina escolar.","B":"Es la definición correcta: el PARD busca restablecer el ejercicio pleno y efectivo de derechos y corresponde a autoridades competentes.","C":"No depende únicamente de una solicitud familiar ni es una estrategia pedagógica interna.","D":"No es sinónimo de investigación penal y puede operar frente a múltiples amenazas o vulneraciones."},"hint":"Distingue entre una medida escolar y un proceso de protección de derechos.","learningNote":"El PARD es un proceso especial de restablecimiento de derechos. La escuela puede activar protección y aportar información, pero no reemplaza a la autoridad administrativa competente.","source":{"reference":"Ley 1098 de 2006, artículos 50, 51 y 99, modificado por Ley 1878 de 2018; ICBF, Proceso Administrativo de Restablecimiento de Derechos"},"estimatedDifficulty":"low"},
          {"id":"DOC-001215","scope":"general","domain":"normativa_educativa","topic":"proteccion_integral","competency":"interpretacion_normativa","questionType":"normative_applied","cognitiveLevel":"apply","context":"Un docente identifica señales persistentes de negligencia: el estudiante llega con hambre, falta reiteradamente y manifiesta que permanece solo durante largos periodos. El equipo propone esperar hasta tener prueba concluyente de quién es responsable.","stem":"¿Cuál actuación institucional es más adecuada?","options":{"A":"Esperar a identificar plenamente al responsable antes de informar a cualquier autoridad.","B":"Documentar hechos observables, adoptar apoyos inmediatos dentro de la competencia escolar y poner oportunamente la situación en conocimiento de la ruta o autoridad competente para valoración y protección.","C":"Interrogar de forma repetida al estudiante hasta obtener una versión jurídicamente completa.","D":"Tramitar primero una sanción por inasistencia y solo si reincide valorar una posible vulneración de derechos."},"correctAnswer":"B","explanations":{"A":"Exigir prueba concluyente puede retrasar la protección y asigna a la escuela una carga investigativa que no le corresponde.","B":"Integra observación, protección inmediata y remisión oportuna sin sustituir a la autoridad competente.","C":"La escuela no debe convertir el acompañamiento en una investigación probatoria que pueda revictimizar.","D":"El patrón puede revelar riesgo o vulneración y no debe reducirse automáticamente a disciplina."},"hint":"La protección no exige que la escuela pruebe primero la responsabilidad de un adulto.","learningNote":"Las instituciones educativas deben identificar señales de riesgo, documentar hechos observables, facilitar acceso y permanencia y activar las instancias competentes cuando exista amenaza o vulneración de derechos.","source":{"reference":"Ley 1098 de 2006, artículos 42 y 44; artículos 50 y 51 sobre restablecimiento de derechos"},"estimatedDifficulty":"medium"},
          {"id":"DOC-001216","scope":"general","domain":"normativa_educativa","topic":"proteccion_integral","competency":"juicio_profesional","questionType":"case_analysis","cognitiveLevel":"analyze","context":"Ante una posible vulneración de derechos, el comité escolar redacta un documento llamado 'auto de apertura de PARD', decide quién es responsable y ordena una medida de ubicación familiar antes de informar al ICBF o a otra autoridad administrativa.","stem":"¿Cuál es el principal error institucional?","options":{"A":"No haber solicitado primero autorización del Consejo Académico.","B":"Haber asumido competencias de la autoridad administrativa: la apertura del PARD y la definición de medidas de restablecimiento corresponden a la autoridad competente tras la verificación de derechos.","C":"No haber aplicado una sanción disciplinaria al estudiante antes de abrir el proceso.","D":"Haber dejado constancia escrita, porque la escuela no puede documentar situaciones de riesgo."},"correctAnswer":"B","explanations":{"A":"El problema no es una autorización del Consejo Académico sino la invasión de competencias legales.","B":"Es la mejor respuesta: la escuela activa protección y aporta información, pero no abre formalmente el PARD ni decide medidas reservadas a la autoridad.","C":"La protección de derechos no está condicionada a sancionar al estudiante.","D":"Documentar hechos observables es compatible con la actuación escolar; lo impropio es sustituir a la autoridad."},"hint":"Identifica qué decisiones pertenecen a la escuela y cuáles a una autoridad de restablecimiento de derechos.","learningNote":"La autoridad administrativa verifica la garantía de derechos y, si identifica amenaza o vulneración, puede abrir el PARD y adoptar medidas. El establecimiento educativo no sustituye esa competencia.","source":{"reference":"Ley 1098 de 2006, artículos 52, 53 y 99, modificado por Ley 1878 de 2018"},"estimatedDifficulty":"high"},
          {"id":"DOC-001217","scope":"general","domain":"convivencia","topic":"proteccion_integral","competency":"decision_pedagogica","questionType":"reasoning","cognitiveLevel":"analyze","context":"Un estudiante que vive una situación familiar crítica reacciona con irritabilidad y rompe una norma de aula. Algunos docentes proponen centrarse exclusivamente en la sanción porque 'la escuela no puede involucrarse en problemas familiares'.","stem":"¿Qué enfoque responde mejor al principio de protección integral?","options":{"A":"Aplicar únicamente la sanción y prohibir que se considere información del contexto familiar.","B":"Eliminar cualquier límite de convivencia porque una situación de vulnerabilidad impide exigir responsabilidades.","C":"Mantener expectativas y garantías de convivencia, pero valorar el contexto de riesgo, adoptar apoyos y activar protección cuando corresponda, priorizando el interés superior del estudiante.","D":"Transferir inmediatamente toda decisión a la familia y suspender la intervención escolar."},"correctAnswer":"C","explanations":{"A":"Ignora información relevante para la protección y puede tratar como mera indisciplina una señal de vulneración.","B":"La protección no equivale a ausencia de límites ni a renunciar a la responsabilidad educativa.","C":"Es la mejor respuesta porque combina convivencia, proporcionalidad, apoyo y prioridad de los derechos del menor.","D":"La corresponsabilidad impide que la escuela se desentienda de una situación conocida."},"hint":"Protección y convivencia no son alternativas excluyentes.","learningNote":"El interés superior y la prevalencia de los derechos de niños, niñas y adolescentes exigen que las decisiones institucionales consideren el contexto de protección sin abandonar la función educativa.","source":{"reference":"Ley 1098 de 2006, artículos 8, 9 y 10"},"estimatedDifficulty":"medium"},
          {"id":"DOC-001218","scope":"general","domain":"convivencia","topic":"proteccion_integral","competency":"gestion_de_aula","questionType":"technical_applied","cognitiveLevel":"apply","context":"Un estudiante revela a su directora de grupo información sensible sobre una posible vulneración de derechos. Para 'conseguir apoyo', alguien propone contar el relato completo en una reunión general de docentes y enviar el audio del estudiante al grupo institucional de mensajería.","stem":"¿Cuál manejo protege mejor al estudiante?","options":{"A":"Compartir el relato íntegro con todo el personal porque todos trabajan en la misma institución.","B":"Difundir el audio sin nombre, ya que eliminar el nombre garantiza por sí solo la privacidad.","C":"Limitar la información a quienes necesitan conocerla para proteger y activar la ruta, registrar solo lo pertinente y evitar exposiciones innecesarias del relato o de datos sensibles.","D":"No dejar ningún registro ni informar a nadie para preservar completamente la confidencialidad."},"correctAnswer":"C","explanations":{"A":"La pertenencia a la institución no justifica acceso indiscriminado a información sensible.","B":"La anonimización informal puede ser insuficiente y la difusión del relato puede generar exposición o revictimización.","C":"Aplica un criterio de necesidad, reserva y protección compatible con la activación de la ruta.","D":"La confidencialidad no exige ocultar una situación a las personas competentes para proteger al estudiante."},"hint":"La reserva protege la información sin bloquear la actuación necesaria.","learningNote":"La protección integral exige equilibrio entre actuar oportunamente y evitar exposición innecesaria. La información sensible debe circular solo entre quienes la requieren para la protección y el seguimiento.","source":{"reference":"Ley 1098 de 2006, artículo 33; Ley 1581 de 2012, principios de acceso y circulación restringida y confidencialidad"},"estimatedDifficulty":"medium"},
          {"id":"DOC-001219","scope":"general","domain":"normativa_educativa","topic":"proteccion_integral","competency":"interpretacion_normativa","questionType":"reading_analysis","cognitiveLevel":"analyze","context":"Una institución recibe noticia de que una autoridad administrativa inició un PARD y ordenó una medida de protección. Un docente afirma que, como el estudiante sigue matriculado, el colegio puede reemplazar esa medida por otra que considere pedagógicamente más conveniente.","stem":"¿Qué interpretación es correcta?","options":{"A":"La escuela puede sustituir cualquier medida porque conserva autonomía pedagógica sobre sus estudiantes.","B":"Las medidas de restablecimiento corresponden a la autoridad competente; la escuela debe cumplir lo que le corresponda, coordinar apoyos y sostener la trayectoria educativa sin reemplazar unilateralmente la decisión protectora.","C":"Toda medida de restablecimiento suspende automáticamente la matrícula y las responsabilidades de la institución.","D":"La familia puede dejar sin efectos la medida con una comunicación al rector."},"correctAnswer":"B","explanations":{"A":"La autonomía escolar no habilita a modificar decisiones de restablecimiento adoptadas por autoridad competente.","B":"Es la mejor respuesta porque distingue competencia protectora y responsabilidad educativa de acompañamiento y continuidad.","C":"El PARD no elimina por regla general el derecho a la educación ni las responsabilidades de coordinación escolar.","D":"Las medidas no se dejan sin efecto mediante una simple comunicación a la institución."},"hint":"Distingue la autoridad que adopta la medida de la institución que acompaña la trayectoria educativa.","learningNote":"Las medidas de restablecimiento pueden ser una o varias y son adoptadas por la autoridad competente. La escuela debe coordinar sus actuaciones y proteger acceso, permanencia y aprendizaje.","source":{"reference":"Ley 1098 de 2006, artículo 53; artículo 42 sobre obligaciones de las instituciones educativas"},"estimatedDifficulty":"medium"},
          {"id":"DOC-001220","scope":"general","domain":"normativa_educativa","topic":"proteccion_integral","competency":"juicio_profesional","questionType":"case_analysis","cognitiveLevel":"judge","context":"Durante una actuación de protección, los adultos toman todas las decisiones sobre un adolescente de 15 años sin informarle qué ocurre ni escuchar su percepción, aunque puede expresarse con claridad sobre su situación y necesidades.","stem":"¿Qué garantía está siendo omitida?","options":{"A":"El derecho del adolescente a dirigir por sí solo el proceso y excluir a toda autoridad.","B":"El derecho a ser escuchado y a que sus opiniones sean tenidas debidamente en cuenta según su edad y madurez en las actuaciones que le afectan.","C":"El derecho a escoger libremente cualquier medida de restablecimiento sin valoración de la autoridad.","D":"El derecho a impedir que la familia participe en cualquier circunstancia."},"correctAnswer":"B","explanations":{"A":"La participación del adolescente no elimina las competencias de protección ni la intervención de otros responsables.","B":"Es la garantía central: los niños y adolescentes son sujetos de derechos y deben poder expresar su opinión en decisiones que les afectan.","C":"Ser escuchado no significa tener decisión unilateral sobre la medida jurídica.","D":"La participación del adolescente no supone excluir automáticamente a la familia."},"hint":"Participar no es decidir solo; es poder ser oído de manera real en actuaciones que afectan la propia vida.","learningNote":"El enfoque de derechos reconoce capacidad progresiva de participación. La opinión del niño, niña o adolescente debe ser escuchada y valorada de acuerdo con su edad y madurez.","source":{"reference":"Convención sobre los Derechos del Niño, artículo 12; Ley 1098 de 2006, artículo 26"},"estimatedDifficulty":"medium"},
          {"id":"DOC-001221","scope":"general","domain":"convivencia","topic":"proteccion_integral","competency":"comprension_conceptual","questionType":"conceptual","cognitiveLevel":"understand","context":"Una familia afirma que la escuela es la única responsable de resolver una vulneración; al mismo tiempo, algunos docentes sostienen que, como el problema ocurre en casa, la institución no tiene ninguna obligación de actuar.","stem":"¿Qué concepto permite corregir ambas posiciones?","options":{"A":"Subsidiariedad disciplinaria: la escuela actúa únicamente cuando la familia renuncia por escrito.","B":"Corresponsabilidad: familia, sociedad y Estado concurren en la atención, cuidado y protección, sin que una parte pueda usar la responsabilidad de otra como excusa para omitir sus propios deberes.","C":"Autonomía familiar absoluta: los asuntos del hogar quedan fuera de cualquier intervención estatal o escolar.","D":"Responsabilidad exclusiva del ICBF en todos los asuntos que involucren menores de edad."},"correctAnswer":"B","explanations":{"A":"La protección no depende de una renuncia familiar ni se reduce a una lógica disciplinaria.","B":"Es la definición adecuada del principio de corresponsabilidad.","C":"Los derechos de niños y adolescentes limitan la pretensión de autonomía absoluta cuando existe amenaza o vulneración.","D":"El ICBF tiene competencias relevantes, pero la protección integral compromete también a familia, sociedad y otras autoridades e instituciones."},"hint":"Busca un principio que distribuya obligaciones sin permitir que nadie se desentienda.","learningNote":"La corresponsabilidad implica concurrencia de actores para garantizar derechos. No significa que todos hagan lo mismo, sino que cada uno cumpla las obligaciones propias de su competencia.","source":{"reference":"Ley 1098 de 2006, artículo 10"},"estimatedDifficulty":"low"},
          {"id":"DOC-001222","scope":"general","domain":"gestion_educativa","topic":"proteccion_integral","competency":"planeacion_pedagogica","questionType":"technical_applied","cognitiveLevel":"apply","context":"Un estudiante entra en una medida de protección fuera de su hogar y deja de asistir temporalmente de forma presencial. La institución propone cancelar su matrícula 'hasta que termine el proceso' para evitar inconsistencias administrativas.","stem":"¿Qué decisión protege mejor su trayectoria educativa?","options":{"A":"Cancelar la matrícula automáticamente porque un PARD suspende el derecho a la educación.","B":"Mantener la responsabilidad institucional sobre acceso y permanencia, coordinar con familia, autoridad y servicios pertinentes y realizar los ajustes necesarios para dar continuidad al proceso educativo.","C":"Exigir que el estudiante repita el grado independientemente de las evidencias de aprendizaje acumuladas.","D":"Esperar a que finalice toda actuación administrativa antes de volver a contactar al estudiante."},"correctAnswer":"B","explanations":{"A":"Una medida de protección no extingue el derecho a la educación ni justifica una cancelación automática.","B":"Es la mejor respuesta porque preserva la trayectoria educativa mediante coordinación y ajustes según la situación concreta.","C":"La repetición automática desconoce la evaluación y las necesidades específicas del estudiante.","D":"Suspender todo contacto puede profundizar la desvinculación escolar."},"hint":"La protección debe procurar también permanencia y continuidad educativa.","learningNote":"Las instituciones educativas tienen deberes de facilitar acceso y permanencia. Una situación de protección exige coordinación interinstitucional y decisiones que eviten que la actuación protectora se convierta en exclusión educativa.","source":{"reference":"Ley 1098 de 2006, artículo 42, numerales 1 y 5; artículo 44"},"estimatedDifficulty":"medium"},
          {"id":"DOC-001223","scope":"general","domain":"normativa_educativa","topic":"proteccion_integral","competency":"resolucion_de_problemas","questionType":"reasoning","cognitiveLevel":"analyze","context":"La institución conoce que un niño permanece varias noches sin un adulto responsable. No hay lesión física conocida. Algunos integrantes sostienen que no puede activarse protección porque todavía no se ha materializado un daño comprobable.","stem":"¿Qué razonamiento es más adecuado?","options":{"A":"La protección solo procede después de un daño consumado y certificado por una autoridad médica.","B":"La existencia de una amenaza seria al ejercicio de derechos puede justificar la actuación protectora; no es necesario esperar a que la vulneración produzca un daño mayor.","C":"La ausencia de lesión física convierte el asunto exclusivamente en un problema de convivencia familiar sin relevancia para la escuela.","D":"La escuela debe determinar primero si existe responsabilidad penal antes de poner la situación en conocimiento de otra autoridad."},"correctAnswer":"B","explanations":{"A":"El sistema de protección actúa también frente a derechos amenazados, no solo después de daños consumados.","B":"Es la mejor respuesta porque comprende la dimensión preventiva del restablecimiento de derechos.","C":"Una amenaza a derechos puede existir sin lesión física y puede requerir protección.","D":"La activación de protección no depende de una calificación penal realizada por la escuela."},"hint":"El sistema protege derechos amenazados además de derechos ya vulnerados.","learningNote":"El restablecimiento de derechos no es únicamente reparador; también opera frente a amenazas que pueden impedir el ejercicio pleno de los derechos de niños, niñas y adolescentes.","source":{"reference":"Ley 1098 de 2006, artículos 50 y 51"},"estimatedDifficulty":"medium"}
          ]
          for d in items:
              p=f"{base}/{d['id']}.json"
              if os.path.exists(p): raise SystemExit(f'already exists: {p}')
              with open(p,'w',encoding='utf-8') as f: json.dump(d,f,ensure_ascii=False,indent=2); f.write('\n')
          def sp(pairs):
              d={}
              for k,v in pairs:
                  if k in d: raise ValueError('duplicate key '+k)
                  d[k]=v
              return d
          def load(p):
              with open(p,encoding='utf-8') as f:return json.load(f,object_pairs_hook=sp)
          domains=load('content/question-bank-v4/taxonomy/domains.json'); topics=load('content/question-bank-v4/taxonomy/topics.json'); comps=load('content/question-bank-v4/taxonomy/competencies.json'); qt=load('content/question-bank-v4/taxonomy/question-types.json')
          allowed={'domain':set(domains),'topic':set(topics),'competency':set(comps),'questionType':set(qt['questionTypes']),'cognitiveLevel':set(qt['cognitiveLevels']),'estimatedDifficulty':set(qt['estimatedDifficultyLevels'])}; req={'id','scope','domain','topic','competency','questionType','cognitiveLevel','context','stem','options','correctAnswer','explanations','hint','learningNote','source','estimatedDifficulty'}
          errs=[]; ids=[]; counters={k:collections.Counter() for k in allowed}; files=sorted(glob.glob(base+'/*.json'))
          for p in files:
              try:d=load(p)
              except Exception as e:errs.append(f'{p}: {e}');continue
              ids.append(d.get('id'))
              if set(d)!=req:errs.append(f'{p}: keys mismatch')
              if d.get('scope')!='general':errs.append(f'{p}: scope')
              for k,v in allowed.items():
                  if d.get(k) not in v:errs.append(f'{p}: invalid {k}={d.get(k)}')
                  counters[k][d.get(k)]+=1
              if set(d.get('options',{}))!={'A','B','C','D'}:errs.append(f'{p}: options')
              if set(d.get('explanations',{}))!={'A','B','C','D'}:errs.append(f'{p}: explanations')
              if d.get('correctAnswer') not in {'A','B','C','D'}:errs.append(f'{p}: answer')
              if set(d.get('source',{}))!={'reference'} or not d['source']['reference'].strip():errs.append(f'{p}: source')
          if len(ids)!=len(set(ids)):errs.append('duplicate ids')
          expected=[f'DOC-{i:06d}' for i in range(1214,1224)]
          for x in expected:
              if x not in ids:errs.append('missing '+x)
          cov={'domains':{k:counters['domain'][k] for k in domains},'topics':{k:counters['topic'][k] for k in topics},'competencies':{k:counters['competency'][k] for k in comps},'questionTypes':{k:counters['questionType'][k] for k in qt['questionTypes']},'cognitiveLevels':{k:counters['cognitiveLevel'][k] for k in qt['cognitiveLevels']},'estimatedDifficulty':{k:counters['estimatedDifficulty'][k] for k in qt['estimatedDifficultyLevels']}}
          report={'generatedAt':'2026-08-22','batch':'DOC-PHASE-A2-20260822','itemCount':len(files),'batchIds':expected,'errors':errs,'coverage':cov}
          with open('content/question-bank-v4/COVERAGE-AFTER-PHASE-A2-20260822.json','w',encoding='utf-8') as f:json.dump(report,f,ensure_ascii=False,indent=2);f.write('\n')
          print(json.dumps(report,ensure_ascii=False,indent=2))
          if errs:sys.exit(1)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content/question-bank-v4/items/docentes content/question-bank-v4/COVERAGE-AFTER-PHASE-A2-20260822.json
          git commit -m 'feat(v4): add phase A2 protection items'
          git pull --rebase origin master
          git push origin HEAD:master
