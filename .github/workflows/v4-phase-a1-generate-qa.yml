name: V4 phase A1 generate and QA

on:
  push:
    paths:
      - '.github/workflows/v4-phase-a1-generate-qa.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate A1 items and validate V4
        shell: bash
        run: |
          python - <<'PY'
          import json, os, glob, collections, sys
          base='content/question-bank-v4/items/docentes'
          items=[
          {
            "id":"DOC-001202","scope":"general","domain":"gestion_educativa","topic":"evaluacion_desempeno_docente","competency":"comprension_conceptual","questionType":"conceptual","cognitiveLevel":"understand",
            "context":"En una jornada institucional, varios docentes describen la evaluación anual de desempeño como una inspección destinada principalmente a encontrar faltas y justificar sanciones. El equipo directivo quiere aclarar el sentido del proceso.",
            "stem":"¿Cuál formulación representa mejor la finalidad de la evaluación anual de desempeño laboral docente?",
            "options":{"A":"Es un procedimiento disciplinario anual para establecer culpabilidad por incumplimientos y aplicar sanciones.","B":"Es un proceso permanente que valora el cumplimiento de funciones y resultados, identifica fortalezas y aspectos de mejoramiento y debe producir información objetiva para retroalimentar el desarrollo profesional.","C":"Es una prueba estandarizada de conocimientos pedagógicos que sustituye la observación del trabajo realizado durante el año.","D":"Es una encuesta de satisfacción de estudiantes y familias cuyo resultado determina por sí solo la permanencia del docente."},
            "correctAnswer":"B","explanations":{"A":"La evaluación anual de desempeño no sustituye el régimen disciplinario ni tiene como finalidad principal declarar responsabilidad por faltas.","B":"Es la mejor respuesta porque integra el carácter permanente, la valoración de funciones y resultados y la finalidad de retroalimentación y mejoramiento prevista en la regulación.","C":"El proceso no se reduce a una prueba de conocimientos; se apoya en evidencias del desempeño laboral durante el período evaluado.","D":"Las encuestas pueden ser una fuente de evidencia, pero no constituyen por sí solas la evaluación ni su finalidad."},
            "hint":"Distingue entre valorar el desempeño para mejorar y adelantar un proceso sancionatorio.","learningNote":"La evaluación anual de desempeño docente busca verificar el quehacer profesional con información objetiva, válida y confiable, identificar fortalezas y aspectos de mejora y aportar al desarrollo profesional y a la calidad educativa.","source":{"reference":"Decreto 3782 de 2007, artículos 2, 3 y 4"},"estimatedDifficulty":"low"
          },
          {
            "id":"DOC-001203","scope":"general","domain":"normativa_educativa","topic":"evaluacion_desempeno_docente","competency":"interpretacion_normativa","questionType":"normative_applied","cognitiveLevel":"apply",
            "context":"Una docente regida por el Decreto Ley 1278 ya superó el período de prueba, pero durante el año académico solo laboró dos meses y veinte días en el establecimiento antes de iniciar una licencia. La rectoría pretende cerrar allí una evaluación anual de desempeño.",
            "stem":"¿Qué decisión se ajusta mejor al ámbito temporal de la evaluación anual regulada por el Decreto 3782 de 2007?",
            "options":{"A":"Evaluarla porque cualquier tiempo de servicio durante el año obliga a producir una calificación anual.","B":"Evaluarla únicamente con una entrevista final, ya que no alcanzó a reunir suficientes evidencias de aula.","C":"No aplicar la evaluación anual por ese período, porque la norma exige haber laborado en el establecimiento un término igual o superior a tres meses durante el año académico.","D":"Declarar automáticamente satisfactoria la evaluación para no afectar su carrera mientras termina la licencia."},
            "correctAnswer":"C","explanations":{"A":"La regulación establece un umbral temporal específico y no ordena evaluación anual por cualquier lapso de servicio.","B":"Una entrevista final no elimina el requisito temporal ni sustituye la recolección de evidencias a lo largo del período.","C":"Es la mejor respuesta: el Decreto 3782 exige haber laborado de forma continua o discontinua durante un término igual o superior a tres meses.","D":"La ausencia del requisito temporal no autoriza asignar una calificación ficticia o automática."},
            "hint":"Revisa si el tiempo efectivamente laborado alcanza el mínimo previsto para la evaluación anual.","learningNote":"La evaluación anual de desempeño se aplica a docentes y directivos sujetos al Decreto Ley 1278 que hayan superado el período de prueba y laborado en el establecimiento por un término igual o superior a tres meses durante el año académico.","source":{"reference":"Decreto 3782 de 2007, artículos 1 y 5"},"estimatedDifficulty":"medium"
          },
          {
            "id":"DOC-001204","scope":"general","domain":"normativa_educativa","topic":"evaluacion_desempeno_docente","competency":"interpretacion_normativa","questionType":"case_analysis","cognitiveLevel":"apply",
            "context":"En una institución oficial deben evaluarse una docente de aula, el coordinador y el rector. Para evitar conflictos, se propone que el coordinador califique a la docente, el rector se autoevalúe y la secretaría evalúe únicamente al coordinador.",
            "stem":"¿Cómo debe distribuirse la responsabilidad de evaluación conforme a la regulación específica?",
            "options":{"A":"El rector o director rural evalúa a docentes y coordinadores; el rector o director rural es evaluado por su superior jerárquico.","B":"El coordinador evalúa a los docentes, el rector evalúa al coordinador y el rector se autoevalúa con efectos definitivos.","C":"La secretaría de educación debe evaluar directamente a todo el personal de cada establecimiento.","D":"El Consejo Directivo asigna cada año los evaluadores mediante votación interna."},
            "correctAnswer":"A","explanations":{"A":"Es la distribución prevista por el Decreto 3782: rector o director rural para docentes y coordinadores, y superior jerárquico para rectores o directores rurales.","B":"El coordinador puede apoyar el proceso, pero la responsabilidad formal de evaluar a docentes y coordinadores recae en el rector o director rural.","C":"La secretaría tiene responsabilidades en el sistema, pero no sustituye de manera general al evaluador definido para cada cargo.","D":"La competencia del evaluador proviene de la norma y no de una elección anual del Consejo Directivo."},
            "hint":"Diferencia entre apoyar el proceso y ser el evaluador formalmente competente.","learningNote":"El evaluador competente depende del cargo: rector o director rural evalúa a docentes y coordinadores; su propio desempeño es valorado por el superior jerárquico definido por la entidad territorial.","source":{"reference":"Decreto 3782 de 2007, artículos 6 y 7"},"estimatedDifficulty":"medium"
          },
          {
            "id":"DOC-001205","scope":"general","domain":"gestion_educativa","topic":"evaluacion_desempeno_docente","competency":"analisis_de_evidencia","questionType":"reading_analysis","cognitiveLevel":"analyze",
            "context":"Para valorar a un docente se presentan cuatro propuestas de evidencia: una queja anónima sin verificación; una única observación hecha el último día; una carpeta con documentos producidos exclusivamente por el evaluador; y un conjunto de evidencias pertinentes recogidas durante el año mediante diversas fuentes, consultables por evaluador y evaluado.",
            "stem":"¿Qué propuesta ofrece la base más sólida para una evaluación válida del desempeño?",
            "options":{"A":"La queja anónima, porque expresa una percepción espontánea y evita sesgos del evaluado.","B":"La observación del último día, porque resume el desempeño final alcanzado.","C":"La carpeta producida solo por el evaluador, porque la participación del evaluado comprometería la objetividad.","D":"El conjunto de evidencias objetivas y pertinentes recogidas a lo largo del período mediante distintas fuentes y disponible para consulta de ambas partes."},
            "correctAnswer":"D","explanations":{"A":"Una queja aislada y no verificada carece de suficiencia y pertinencia para representar el desempeño anual.","B":"Una sola observación final no representa un proceso permanente ni permite contrastar la evolución del desempeño.","C":"La regulación permite que las evidencias sean aportadas y consultadas tanto por evaluador como por evaluado.","D":"Es la mejor respuesta porque combina pertinencia, diversidad, continuidad temporal y posibilidad de contraste por las partes."},
            "hint":"Busca evidencia que represente el período completo y pueda ser contrastada, no un episodio aislado.","learningNote":"Las evidencias de la evaluación deben ser objetivas y pertinentes, recolectarse durante todo el período y pueden provenir de distintos instrumentos; evaluador y evaluado pueden aportarlas y consultarlas.","source":{"reference":"Decreto 3782 de 2007, artículo 19"},"estimatedDifficulty":"medium"
          },
          {
            "id":"DOC-001206","scope":"general","domain":"gestion_educativa","topic":"evaluacion_desempeno_docente","competency":"planeacion_pedagogica","questionType":"technical_applied","cognitiveLevel":"apply",
            "context":"Una rectoría diseña el cronograma de evaluación anual y propone una única reunión en diciembre para asignar la calificación definitiva, sin valoración intermedia ni comunicación previa al docente.",
            "stem":"¿Qué ajuste debe hacer al cronograma para respetar la lógica de seguimiento prevista en el Decreto 3782?",
            "options":{"A":"Mantener una sola reunión y permitir que el docente entregue una autoevaluación escrita al final.","B":"Incluir una primera valoración hacia la mitad del año con las evidencias disponibles, comunicarla al evaluado y realizar una segunda valoración al final con las evidencias posteriores.","C":"Sustituir las valoraciones por una encuesta semestral de estudiantes y promediar sus resultados.","D":"Realizar valoraciones mensuales con calificación definitiva acumulativa, aunque la norma no prevea ese procedimiento."},
            "correctAnswer":"B","explanations":{"A":"La autoevaluación final no reemplaza el seguimiento y las dos valoraciones previstas para el proceso anual.","B":"Es la mejor respuesta porque reproduce la estructura de valoración intermedia, comunicación y valoración final basada en evidencias.","C":"Una encuesta puede aportar información, pero no sustituye las valoraciones de competencias y el conjunto de evidencias.","D":"El seguimiento puede ser continuo, pero la regulación no exige convertir cada mes en una calificación definitiva acumulativa."},
            "hint":"La evaluación anual incluye seguimiento antes de la calificación final.","learningNote":"El proceso anual contempla una primera valoración a mitad del año académico y una segunda al final; la primera debe comunicarse al evaluado y ambas se sustentan en las evidencias recogidas en sus respectivos períodos.","source":{"reference":"Decreto 3782 de 2007, artículo 20"},"estimatedDifficulty":"medium"
          },
          {
            "id":"DOC-001207","scope":"general","domain":"normativa_educativa","topic":"evaluacion_desempeno_docente","competency":"comprension_conceptual","questionType":"conceptual","cognitiveLevel":"understand",
            "context":"Un equipo revisa los principios que deben orientar la evaluación anual de desempeño y quiere diferenciar criterios jurídicos del proceso frente a preferencias internas de la institución.",
            "stem":"¿Cuál conjunto corresponde a los principios expresamente asociados a esta evaluación?",
            "options":{"A":"Rapidez, reserva absoluta, jerarquía, obediencia y sanción.","B":"Competitividad, productividad, antigüedad, disciplina y uniformidad.","C":"Objetividad, confiabilidad, universalidad, pertinencia, transparencia, participación y concurrencia.","D":"Autonomía individual, discrecionalidad del evaluador, informalidad y confidencialidad total."},
            "correctAnswer":"C","explanations":{"A":"La regulación no define la evaluación mediante una lógica de obediencia y sanción ni de reserva absoluta.","B":"Estos términos no constituyen el conjunto de principios establecidos para la evaluación anual docente.","C":"Es el conjunto previsto por el Decreto Ley 1278 y reiterado en el Decreto 3782 para orientar la evaluación.","D":"La evaluación debe ser transparente y participativa, por lo que no se apoya en discrecionalidad irrestricta ni informalidad."},
            "hint":"Busca principios que protejan la calidad técnica y la participación en la evaluación.","learningNote":"La objetividad y la confiabilidad se complementan con pertinencia, transparencia, participación y concurrencia; la evaluación no es una decisión discrecional sin contraste.","source":{"reference":"Decreto 3782 de 2007, artículo 4; Decreto Ley 1278 de 2002, artículo 29"},"estimatedDifficulty":"low"
          },
          {
            "id":"DOC-001208","scope":"general","domain":"gestion_educativa","topic":"evaluacion_desempeno_docente","competency":"analisis_de_evidencia","questionType":"reasoning","cognitiveLevel":"analyze",
            "context":"Tras cerrar las evaluaciones, la rectoría archiva las calificaciones como documentos individuales y decide no relacionarlas con la autoevaluación institucional ni con las necesidades de formación del equipo docente.",
            "stem":"¿Qué oportunidad de mejora está perdiendo la institución?",
            "options":{"A":"Ninguna, porque los resultados de evaluación pertenecen exclusivamente a la hoja de vida del evaluado.","B":"Convertir las calificaciones en un ranking público para premiar y sancionar a los docentes.","C":"Usar los resultados, de manera agregada y pertinente, como insumo para la autoevaluación institucional y para planes de mejoramiento y desarrollo personal y profesional.","D":"Reemplazar el PMI por el promedio de las calificaciones individuales del equipo docente."},
            "correctAnswer":"C","explanations":{"A":"La regulación prevé una función institucional de los resultados más allá de su efecto individual.","B":"La finalidad no es establecer rankings públicos y esa práctica puede generar problemas de confidencialidad y de uso indebido de la información.","C":"Es la mejor respuesta porque conecta evaluación, autoevaluación institucional y desarrollo profesional sin convertir los puntajes en un fin en sí mismos.","D":"Los resultados son un insumo, no un sustituto del diagnóstico integral ni de la planificación institucional."},
            "hint":"Piensa en cómo una evaluación individual puede informar decisiones de mejora sin convertirse en un ranking.","learningNote":"La regulación vincula la evaluación anual con la autoevaluación institucional y con los planes de mejoramiento institucional y de desarrollo personal y profesional.","source":{"reference":"Decreto 3782 de 2007, artículo 3"},"estimatedDifficulty":"medium"
          },
          {
            "id":"DOC-001209","scope":"general","domain":"normativa_educativa","topic":"carrera_docente","competency":"interpretacion_normativa","questionType":"normative_applied","cognitiveLevel":"judge",
            "context":"Un docente obtiene por primera vez una evaluación anual no satisfactoria. El rector propone declarar inmediatamente insubsistente su nombramiento argumentando que una calificación inferior al nivel satisfactorio demuestra falta de idoneidad definitiva.",
            "stem":"¿Cuál respuesta es jurídicamente más adecuada?",
            "options":{"A":"Procede la insubsistencia inmediata con la primera evaluación no satisfactoria.","B":"La primera evaluación no satisfactoria exige seguimiento y mejoramiento; las consecuencias de exclusión del escalafón y retiro previstas para el docente se producen cuando obtiene por segunda vez consecutiva una evaluación no satisfactoria.","C":"La evaluación no satisfactoria nunca genera consecuencias de carrera, sin importar su reiteración.","D":"El Consejo Directivo puede decidir libremente si una sola evaluación basta para retirar al docente."},
            "correctAnswer":"B","explanations":{"A":"La consecuencia de retiro prevista en el régimen no se activa por una primera calificación no satisfactoria aislada.","B":"Es la mejor respuesta: tras una evaluación no satisfactoria se exige seguimiento, y la segunda consecutiva activa las consecuencias establecidas para el docente.","C":"La regulación sí contempla consecuencias cuando se configura el supuesto de reiteración consecutiva.","D":"Las consecuencias de carrera son normativas y no dependen de una decisión discrecional del Consejo Directivo."},
            "hint":"Distingue la primera evaluación no satisfactoria de la reiteración consecutiva prevista en la norma.","learningNote":"Una evaluación no satisfactoria debe generar seguimiento al plan de desarrollo personal y profesional; para docentes, la segunda evaluación anual no satisfactoria consecutiva activa las consecuencias de carrera previstas en el régimen.","source":{"reference":"Decreto 3782 de 2007, artículo 25; Decreto Ley 1278 de 2002, artículo 36"},"estimatedDifficulty":"high"
          },
          {
            "id":"DOC-001210","scope":"general","domain":"normativa_educativa","topic":"carrera_docente","competency":"comprension_conceptual","questionType":"conceptual","cognitiveLevel":"understand",
            "context":"Un grupo de aspirantes confunde tres momentos de la carrera docente: la evaluación que sigue al concurso y al nombramiento inicial, la evaluación que se realiza cada año y los procesos relacionados con ascenso o reubicación salarial.",
            "stem":"¿Qué distinción es correcta?",
            "options":{"A":"Los tres nombres describen una única evaluación aplicada una vez al año a todo docente.","B":"La evaluación anual reemplaza el período de prueba y automáticamente produce ascensos cuando el resultado es sobresaliente.","C":"El período de prueba solo aplica a docentes provisionales y la evaluación anual solo a quienes aspiran a ascender.","D":"Son procesos distintos: el período de prueba verifica el desempeño inicial para ingreso a carrera, la evaluación anual valora de forma periódica el desempeño laboral y el ascenso o reubicación se tramita mediante el proceso específico previsto para la carrera."},
            "correctAnswer":"D","explanations":{"A":"El estatuto distingue expresamente varios tipos y finalidades de evaluación.","B":"Un buen resultado anual no convierte esa evaluación en el procedimiento de ascenso o reubicación.","C":"El período de prueba se relaciona con el ingreso a la carrera luego del concurso, no con la provisionalidad como regla general.","D":"Es la mejor respuesta porque diferencia finalidad y momento de tres procesos que no son intercambiables."},
            "hint":"Relaciona cada evaluación con ingreso, seguimiento periódico o desarrollo en el escalafón.","learningNote":"La carrera docente distingue evaluación de período de prueba, evaluación ordinaria periódica de desempeño anual y procesos de evaluación vinculados al ascenso o reubicación; no deben confundirse sus efectos.","source":{"reference":"Decreto Ley 1278 de 2002, artículos 27, 31 y 32; Ministerio de Educación Nacional, Información sobre procesos de evaluación, actualización 2026-08-04"},"estimatedDifficulty":"medium"
          },
          {
            "id":"DOC-001211","scope":"general","domain":"normativa_educativa","topic":"carrera_docente","competency":"interpretacion_normativa","questionType":"case_analysis","cognitiveLevel":"apply",
            "context":"Una persona seleccionada por concurso fue nombrada en período de prueba cuando faltaban tres meses para terminar el año escolar. Al cierre del calendario solicita que se evalúe definitivamente su período de prueba para adquirir derechos de carrera.",
            "stem":"¿Qué elemento impide cerrar válidamente el período de prueba con la información descrita?",
            "options":{"A":"El período de prueba solo puede evaluarse después de dos años completos de servicio.","B":"Para culminarlo al cierre del año escolar debe haber desempeñado el cargo por lo menos durante cuatro meses; tres meses no satisfacen ese mínimo.","C":"Quien ingresa por concurso no requiere evaluación de período de prueba para adquirir derechos de carrera.","D":"La evaluación solo puede hacerse cuando exista una vacante distinta a aquella en la que fue nombrado."},
            "correctAnswer":"B","explanations":{"A":"El estatuto no fija un requisito general de dos años completos para la evaluación de período de prueba.","B":"Es la mejor respuesta porque el Decreto Ley 1278 exige al menos cuatro meses de desempeño del cargo para culminar ese período al finalizar el año escolar.","C":"La aprobación del período de prueba es condición para adquirir los derechos de carrera y la inscripción correspondiente.","D":"La evaluación se refiere al cargo para el cual fue nombrado en período de prueba, no a la aparición de otra vacante."},
            "hint":"La clave está en el tiempo mínimo efectivamente desempeñado antes de cerrar el período de prueba.","learningNote":"La persona nombrada en período de prueba debe desempeñar el cargo al menos cuatro meses para culminarlo al finalizar el correspondiente año escolar; una evaluación satisfactoria permite adquirir los derechos de carrera e inscripción en el escalafón.","source":{"reference":"Decreto Ley 1278 de 2002, artículo 12"},"estimatedDifficulty":"medium"
          },
          {
            "id":"DOC-001212","scope":"general","domain":"normativa_educativa","topic":"carrera_docente","competency":"analisis_de_evidencia","questionType":"reading_analysis","cognitiveLevel":"analyze",
            "context":"Un docente obtiene 96 puntos en su evaluación anual de desempeño y afirma que ese resultado obliga a la entidad territorial a reubicarlo de inmediato en el siguiente nivel salarial. Su argumento se basa únicamente en la calificación anual.",
            "stem":"¿Cuál análisis es más consistente con la estructura de la carrera docente?",
            "options":{"A":"La afirmación es correcta porque toda evaluación anual sobresaliente produce automáticamente una reubicación salarial.","B":"La afirmación es correcta solo si el rector certifica que no existen vacantes en el establecimiento.","C":"La evaluación anual y el proceso de ascenso o reubicación son mecanismos distintos; un resultado anual alto puede acreditar buen desempeño, pero no sustituye el procedimiento específico de ascenso o reubicación.","D":"La calificación anual carece de cualquier efecto dentro de la carrera y por eso nunca puede ser considerada por otra actuación administrativa."},
            "correctAnswer":"C","explanations":{"A":"El resultado anual no reemplaza por sí mismo los requisitos y el procedimiento específico de ascenso o reubicación.","B":"La existencia de vacantes no convierte la evaluación anual en un mecanismo automático de reubicación salarial.","C":"Es la mejor respuesta porque reconoce la diferencia funcional entre evaluación periódica del desempeño y procesos de movilidad en el escalafón.","D":"La evaluación anual sí tiene efectos y relevancia en la carrera, aunque no produzca automáticamente el ascenso o la reubicación."},
            "hint":"Pregunta si una buena evaluación anual equivale jurídicamente al procedimiento específico de ascenso.","learningNote":"El MEN distingue actualmente evaluación de período de prueba, evaluación anual de desempeño y evaluación de ascenso y reubicación. Un resultado favorable en una no convierte automáticamente ese proceso en otro.","source":{"reference":"Ministerio de Educación Nacional, Información sobre procesos de evaluación, actualización 2026-08-04; Decreto Ley 1278 de 2002, artículos 26 y 27"},"estimatedDifficulty":"medium"
          },
          {
            "id":"DOC-001213","scope":"general","domain":"normativa_educativa","topic":"evaluacion_desempeno_docente","competency":"juicio_profesional","questionType":"reasoning","cognitiveLevel":"analyze",
            "context":"Tras una discusión fuerte entre un docente y un directivo, el rector anuncia que reducirá la calificación de desempeño como forma de sancionar la actitud del docente, sin relacionar la decisión con competencias evaluadas ni con evidencias del período.",
            "stem":"¿Por qué esa decisión es improcedente dentro del proceso de evaluación anual?",
            "options":{"A":"Porque la evaluación anual nunca puede considerar competencias comportamentales.","B":"Porque cualquier conflicto interpersonal debe producir automáticamente una calificación sobresaliente mientras no exista sanción disciplinaria.","C":"Porque la evaluación debe fundarse en competencias, funciones, resultados y evidencias objetivas y pertinentes; no puede utilizarse una reducción discrecional de la calificación como castigo ajeno al procedimiento evaluativo.","D":"Porque solo los estudiantes pueden aportar información relacionada con las competencias comportamentales del docente."},
            "correctAnswer":"C","explanations":{"A":"La evaluación sí incluye competencias comportamentales; el problema es utilizarlas sin evidencia y como sanción discrecional.","B":"La inexistencia de sanción disciplinaria no determina por sí sola la calificación del desempeño.","C":"Es la mejor respuesta porque preserva la finalidad y los principios de objetividad, pertinencia y evidencia del proceso evaluativo.","D":"Las evidencias pueden provenir de diferentes fuentes y no están reservadas exclusivamente a los estudiantes."},
            "hint":"Distingue valorar competencias con evidencia de usar una nota como castigo.","learningNote":"La evaluación anual no es una sanción disciplinaria encubierta. Las valoraciones deben estar relacionadas con competencias, funciones y resultados, y apoyarse en evidencias objetivas y pertinentes recogidas durante el período.","source":{"reference":"Decreto 3782 de 2007, artículos 2, 4 y 19"},"estimatedDifficulty":"high"
          }
          ]
          for d in items:
              p=f"{base}/{d['id']}.json"
              if os.path.exists(p):
                  raise SystemExit(f'already exists: {p}')
              with open(p,'w',encoding='utf-8') as f:
                  json.dump(d,f,ensure_ascii=False,indent=2); f.write('\n')
          def strict_pairs(pairs):
              out={}
              for k,v in pairs:
                  if k in out: raise ValueError(f'duplicate key {k}')
                  out[k]=v
              return out
          def load(p):
              with open(p,encoding='utf-8') as f: return json.load(f,object_pairs_hook=strict_pairs)
          domains=load('content/question-bank-v4/taxonomy/domains.json')
          topics=load('content/question-bank-v4/taxonomy/topics.json')
          competencies=load('content/question-bank-v4/taxonomy/competencies.json')
          qt=load('content/question-bank-v4/taxonomy/question-types.json')
          allowed={'domain':set(domains),'topic':set(topics),'competency':set(competencies),'questionType':set(qt['questionTypes']),'cognitiveLevel':set(qt['cognitiveLevels']),'estimatedDifficulty':set(qt['estimatedDifficultyLevels'])}
          required={'id','scope','domain','topic','competency','questionType','cognitiveLevel','context','stem','options','correctAnswer','explanations','hint','learningNote','source','estimatedDifficulty'}
          errs=[]; ids=[]; counters={k:collections.Counter() for k in allowed}
          files=sorted(glob.glob(base+'/*.json'))
          for p in files:
              try:d=load(p)
              except Exception as e: errs.append(f'{p}: {e}'); continue
              ids.append(d.get('id'))
              if set(d)!=required: errs.append(f'{p}: keys mismatch')
              if d.get('scope')!='general': errs.append(f'{p}: scope')
              for k,v in allowed.items():
                  if d.get(k) not in v: errs.append(f'{p}: invalid {k}={d.get(k)}')
                  counters[k][d.get(k)]+=1
              if set(d.get('options',{}))!={'A','B','C','D'}: errs.append(f'{p}: options')
              if set(d.get('explanations',{}))!={'A','B','C','D'}: errs.append(f'{p}: explanations')
              if d.get('correctAnswer') not in {'A','B','C','D'}: errs.append(f'{p}: correctAnswer')
