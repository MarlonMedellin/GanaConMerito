name: V4 coverage snapshot

on:
  push:
    paths:
      - '.github/workflows/v4-coverage-snapshot.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compute V4 coverage snapshot
        shell: bash
        run: |
          python - <<'PY'
          import json, glob, collections
          files=sorted(glob.glob('content/question-bank-v4/items/docentes/*.json'))
          fields=['domain','topic','competency','questionType','cognitiveLevel','estimatedDifficulty']
          counters={f:collections.Counter() for f in fields}
          invalid=[]
          for p in files:
              try:
                  with open(p,encoding='utf-8') as fh: d=json.load(fh)
              except Exception as e:
                  invalid.append({'path':p,'error':str(e)})
                  continue
              for f in fields:
                  counters[f][d.get(f)] += 1
          catalogs={}
          for name,path in {
              'domains':'content/question-bank-v4/taxonomy/domains.json',
              'topics':'content/question-bank-v4/taxonomy/topics.json',
              'competencies':'content/question-bank-v4/taxonomy/competencies.json'
          }.items():
              with open(path,encoding='utf-8') as fh: catalogs[name]=json.load(fh)
          with open('content/question-bank-v4/taxonomy/question-types.json',encoding='utf-8') as fh:
              qtax=json.load(fh)
          def ordered(keys,counter): return {k:counter.get(k,0) for k in keys}
          snapshot={
              'generatedAt':'2026-08-22',
              'itemCount':len(files)-len(invalid),
              'invalidJson':invalid,
              'coverage':{
                  'domains':ordered(catalogs['domains'],counters['domain']),
                  'topics':ordered(catalogs['topics'],counters['topic']),
                  'competencies':ordered(catalogs['competencies'],counters['competency']),
                  'questionTypes':ordered(qtax['questionTypes'],counters['questionType']),
                  'cognitiveLevels':ordered(qtax['cognitiveLevels'],counters['cognitiveLevel']),
                  'estimatedDifficulty':ordered(qtax['estimatedDifficultyLevels'],counters['estimatedDifficulty'])
              }
          }
          snapshot['missing']={k:[x for x,v in vals.items() if v==0] for k,vals in snapshot['coverage'].items() if k!='estimatedDifficulty'}
          with open('content/question-bank-v4/COVERAGE-SNAPSHOT-20260822.json','w',encoding='utf-8') as fh:
              json.dump(snapshot,fh,ensure_ascii=False,indent=2); fh.write('\n')
          print(json.dumps(snapshot,ensure_ascii=False,indent=2))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content/question-bank-v4/COVERAGE-SNAPSHOT-20260822.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'docs(v4): add coverage baseline snapshot'
          git push
