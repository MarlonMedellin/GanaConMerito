name: V4 phase A documentation sync retry

on:
  push:
    paths:
      - '.github/workflows/v4-phase-a-doc-sync-2.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Synchronize V4 docs and skills
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def get(p): return Path(p).read_text(encoding='utf-8')
          def put(p,s): Path(p).write_text(s,encoding='utf-8')
          def replace(p, old, new):
              s=get(p)
              if new in s: return
              if old not in s: raise SystemExit(f'{p}: replacement anchor not found: {old[:100]}')
              put(p,s.replace(old,new,1))
          def after(p, anchor, addition):
              s=get(p)
              if addition.strip() in s: return
              if anchor not in s: raise SystemExit(f'{p}: insertion anchor not found: {anchor[:100]}')
              put(p,s.replace(anchor,anchor+addition,1))

          # Factories.
          p='docs/ai/skills/GCM-Master-Question-Factory-Docentes.md'
          replace(p,'**Versión:** 1.1','**Versión:** 1.2')
          replace(p,
            'Clasifica `domain`, `topic`, `competency`, `questionType` y `cognitiveLevel` usando EXCLUSIVAMENTE los valores de `content/question-bank-v4/taxonomy/*.json`; no inventes valores nuevos: si un constructo no encaja, usa el valor más cercano y reporta la ampliación propuesta por separado (nunca dentro del ítem).',
            'Clasifica `domain`, `topic`, `competency`, `questionType` y `cognitiveLevel` usando EXCLUSIVAMENTE los valores vigentes de `content/question-bank-v4/taxonomy/*.json`. **No fuerces el valor “más cercano” si describe falsamente el constructo.** Si ningún valor vigente encaja sin distorsión, la fábrica no modifica el catálogo ni serializa el ítem: informa al orquestador una necesidad de ampliación taxonómica fuera del reactivo. El orquestador solo puede ampliar el catálogo cuando exista una necesidad editorial real conforme a `content/question-bank-v4/CONTRATO-EDITORIAL-V4.md`; después debe reejecutar fábrica y auditor con la taxonomía ya actualizada. Antes de cada ejecución, lee los catálogos actuales y el estado vigente señalado en `content/question-bank-v4/README.md`; no hardcodees conteos, tópicos ni siguiente ID.')

          p='docs/ai/skills/GCM-Master-Question-Factory-OPEC-General.md'
          replace(p,'**Versión:** 1.1 ·','**Versión:** 1.2 ·')
          replace(p,
            'Clasifica `domain`, `topic`, `competency`, `questionType` y `cognitiveLevel` usando EXCLUSIVAMENTE los valores de `content/question-bank-v4/taxonomy/*.json`; no inventes valores nuevos: si un constructo no encaja, usa el valor más cercano y reporta la ampliación propuesta por separado (nunca dentro del ítem).',
            'Clasifica `domain`, `topic`, `competency`, `questionType` y `cognitiveLevel` usando EXCLUSIVAMENTE los valores vigentes de `content/question-bank-v4/taxonomy/*.json`. **No fuerces el valor “más cercano” si describe falsamente el constructo.** Si ningún valor vigente encaja sin distorsión, la fábrica no modifica el catálogo ni serializa el ítem: informa al orquestador una necesidad de ampliación taxonómica fuera del reactivo. El orquestador solo puede ampliar el catálogo cuando exista una necesidad editorial real conforme a `content/question-bank-v4/CONTRATO-EDITORIAL-V4.md`; después debe reejecutar fábrica y auditor con la taxonomía ya actualizada. Antes de cada ejecución, lee los catálogos actuales y el estado vigente señalado en `content/question-bank-v4/README.md`; no hardcodees conteos, tópicos ni siguiente ID.')

          # Auditors.
          p='docs/ai/skills/GCM-Adversarial-Item-Auditor-Docentes.md'
          replace(p,'**Versión:** 1.1','**Versión:** 1.2')
          replace(p,
            '5. **Constructo y taxonomía:** identifica qué mide realmente. Debe ser relevante y coincidir con `domain`, `topic`, `competency`, `questionType` y `cognitiveLevel`, y que esos cinco valores pertenezcan a `content/question-bank-v4/taxonomy/*.json`.',
            '5. **Constructo y taxonomía:** identifica qué mide realmente. Debe ser relevante y coincidir semánticamente con `domain`, `topic`, `competency`, `questionType` y `cognitiveLevel`, y esos cinco valores deben pertenecer a `content/question-bank-v4/taxonomy/*.json`. Pertenecer al catálogo no basta: rechaza una etiqueta usada como “valor más cercano” si oculta o falsea el constructo. Si ningún tópico vigente encaja sin distorsión, registra un hallazgo bloqueante de brecha taxonómica; el orquestador podrá ampliar el catálogo solo bajo la regla de necesidad editorial real del contrato y deberá regenerar/auditar de nuevo antes de serializar.')
          after(p,
            'El orquestador —no el auditor— registra el veredicto en `content/question-bank-v4/legacy-processing-register.csv`, consignando el agente real en `audit_agent`. Un `REJECTED` no es terminal: se resuelve con `REGENERATE_FROM_ZERO` (→ `processed_serialized`) o `ABANDON` (queda `processed_discarded`), dejando la cadena de resolución explícita en `notes`.\n',
            '\nAntes de auditar, lee los catálogos vigentes y el estado actual indicado en `content/question-bank-v4/README.md`; no uses listas, conteos o IDs recordados de ejecuciones anteriores.\n')

          p='docs/ai/skills/GCM-Adversarial-Item-Auditor-OPEC-General.md'
          replace(p,'**Versión:** 1.1 ·','**Versión:** 1.2 ·')
          replace(p,
            '7. **Taxonomía.** `domain`, `topic`, `competency`, `questionType` y `cognitiveLevel` deben describir el reactivo real y pertenecer a `content/question-bank-v4/taxonomy/*.json`.',
            '7. **Taxonomía.** `domain`, `topic`, `competency`, `questionType` y `cognitiveLevel` deben describir semánticamente el reactivo real y pertenecer a `content/question-bank-v4/taxonomy/*.json`. Pertenecer al catálogo no basta: rechaza una etiqueta usada como “valor más cercano” si distorsiona el constructo. Si ningún tópico vigente encaja sin falsearlo, registra una brecha taxonómica bloqueante; el orquestador puede ampliar el catálogo únicamente por necesidad editorial real según `CONTRATO-EDITORIAL-V4.md` y debe reejecutar el ciclo antes de serializar.')
          after(p,
            'El orquestador —no el auditor— registra el veredicto en `content/question-bank-v4/legacy-processing-register.csv`, consignando el agente real en `audit_agent`. Un `REJECTED` no es terminal: se resuelve con `REGENERATE_FROM_ZERO` (→ `processed_serialized`) o `ABANDON` (→ `processed_discarded`), dejando la cadena de resolución explícita en `notes`.\n',
            '\nAntes de auditar, lee los catálogos vigentes y el estado actual indicado en `content/question-bank-v4/README.md`; no uses listas, conteos o IDs recordados de ejecuciones anteriores.\n')

          # Governance for all agents.
          p='AGENTS.md'
          after(p,
            'Este alcance editorial no autoriza cambios al codigo fuente legacy de la aplicacion.\n',
            '\n**Regla de sincronizacion V4:** cualquier cambio en `content/question-bank-v4/CONTRATO-EDITORIAL-V4.md`, `taxonomy/`, reactivos productivos o el snapshot de cobertura vigente obliga a revisar, y actualizar cuando corresponda, `content/question-bank-v4/README.md`, las cuatro skills de fabrica/auditoria, `content/README.md`, `content/GUIA-PARA-AGENTES-IA.md`, `docs/database/question-bank-v4-contract.md`, `docs/architecture/question-bank-v4-adoption.md`, `docs/project/status.md`, `docs/02-delivery/sprint-log.md` y `docs/05-ops/documentation-trigger-map.md`. Los snapshots y cierres historicos conservan sus cifras originales y no se reescriben para simular estado actual.\n')

          # Trigger map.
          p='docs/05-ops/documentation-trigger-map.md'
          replace(p,'Last reviewed: 2026-05-10','Last reviewed: 2026-08-22')
          after(p,'| content/items/ | validation scripts, taxonomy, editorial docs | Alta |\n',
            '| `content/question-bank-v4/CONTRATO-EDITORIAL-V4.md` | `taxonomy/`, README V4, 4 skills GCM, contrato DB, adopción técnica, guías de agentes | Alta |\n'
            '| `content/question-bank-v4/taxonomy/` | contrato editorial, 4 skills GCM, validador/importador, README V4, snapshot vigente | Alta |\n'
            '| `content/question-bank-v4/items/` o snapshot vigente | README V4, status, sprint-log, importador/PRD si contienen conteos corrientes | Alta |\n'
            '| `docs/ai/skills/GCM-*Question*` | contrato editorial V4, taxonomías, AGENTS.md y guías de agentes | Alta |\n')

          # Content navigation.
          p='content/README.md'
          after(p,
            '`content/question-bank-v4/CONTRATO-EDITORIAL-V4.md`; su activación técnica se\ndefine fuera de `content`, en la documentación de arquitectura y base de datos.\n',
            '\n**Estado V4 vigente (2026-08-22):** 224 reactivos docentes válidos, 22 tópicos canónicos y `errors: []` en `content/question-bank-v4/COVERAGE-AFTER-PHASE-A-20260822.json`. El siguiente ID esperado es `DOC-001256`, sujeto a comprobación de disponibilidad. Estas cifras describen el snapshot vigente; los cierres de lotes anteriores permanecen como evidencia histórica.\n')

          p='content/GUIA-PARA-AGENTES-IA.md'
          replace(p,
            '8. Validar todo resultado contra `content/question-bank-v4/CONTRATO-EDITORIAL-V4.md`\n   antes de serializarlo.\n',
            '8. Validar todo resultado contra `content/question-bank-v4/CONTRATO-EDITORIAL-V4.md`\n   antes de serializarlo.\n9. Leer `content/question-bank-v4/README.md` y el snapshot de cobertura vigente antes de asumir conteos, tópicos o el siguiente ID.\n')
          after(p,'- Si una pregunta cambia, registrar el origen, la razon y la validacion.\n',
            '- Si cambia contrato, taxonomía, reactivos V4 o el snapshot vigente, revisar las cuatro skills GCM y la documentación técnica/operativa relacionada según `docs/05-ops/documentation-trigger-map.md`. No reescribir snapshots históricos para reflejar el estado nuevo.\n')

          # Technical docs.
          p='docs/database/question-bank-v4-contract.md'
          after(p,'al importador TypeScript y al auditor, no a constraints SQL frágiles.\n',
            '\nLos catálogos de `content/question-bank-v4/taxonomy/` son la autoridad vigente y pueden ampliarse únicamente bajo la regla de necesidad editorial real del contrato editorial. El validador e importador deben leerlos dinámicamente; no deben duplicar una lista estática de tópicos en SQL, documentación o código.\n')
          p='docs/architecture/question-bank-v4-adoption.md'
          after(p,'- `npm run content:validate:v4` valida todos los JSON bajo `content/question-bank-v4/items/`\n  contra los catálogos locales.\n',
            '- Los catálogos V4 son file-authoritative y extensibles solo por necesidad editorial real; validadores, importadores y selectores no deben hardcodear el número ni la lista de tópicos.\n')

          # Current status only; historical expansion reports stay immutable.
          p='docs/project/status.md'
          replace(p,
            'El ultimo corte editorial aprobado validado es `9429c55`; `master` puede contener\nlotes posteriores en curso. El runtime mantiene un drift amplio frente al repositorio.\ncommits detras de esa base, incluyendo el bloque de seguridad ya publicado.',
            'El corte editorial V4 vigente en `master` es `content/question-bank-v4/COVERAGE-AFTER-PHASE-A-20260822.json`: **224 reactivos válidos**, con 54/54 incorporaciones de la Fase A y `errors: []`. El runtime mantiene un drift amplio frente al repositorio y no debe confundirse este cierre editorial con importación o activación productiva.')
          replace(p,
            '- El banco V4 tiene 150 reactivos estructuralmente validos y aprobados al corte\n  `9429c55`; los lotes posteriores no se cuentan hasta su cierre. Mantiene cero\n  documentos en `sources/`;\n  calidad editorial no equivale a fuente normativa verificada.',
            '- El banco V4 tiene **224 reactivos estructuralmente válidos** en el snapshot canónico `COVERAGE-AFTER-PHASE-A-20260822.json`, con 22 tópicos y `errors: []`. Mantiene cero documentos en `sources/`; calidad editorial no equivale a fuente normativa verificada ni a activación runtime.')
          replace(p,
            '- Al corte actual hay 150 archivos V4 estructuralmente válidos y con evidencia\n  cerrada para el plan de importación. No se revisaron items individuales.',
            '- Al corte editorial actual hay **224 archivos V4 estructuralmente válidos** y con cierre de QA en `COVERAGE-AFTER-PHASE-A-20260822.json`. Este dato describe el corpus del repo; no implica que los 224 estén importados o activos en Supabase.')

          p='docs/02-delivery/sprint-log.md'
          replace(p,
            '- **Último corte editorial aprobado validado**: `9429c55` en `master`; Bloque 0 publicado en `f977d46`, dominio canónico en `7f73f32` e importador en `420f1bf`.',
            '- **Último corte editorial V4 validado**: `content/question-bank-v4/COVERAGE-AFTER-PHASE-A-20260822.json`, 224 reactivos, 54/54 de la Fase A y `errors: []`; este corte editorial no equivale a importación/runtime.')
          replace(p,
            '- **V4 local**: 150 reactivos estructuralmente válidos y aprobados para importación;\n  1 V4 observado en Supabase.',
            '- **V4 local**: 224 reactivos estructuralmente válidos según el snapshot canónico de Fase A;\n  1 V4 observado en Supabase en la última lectura pública registrada.')

          # Change log.
          p='docs/02-delivery/change-log.md'
          block='''## 2026-08-22 — V4 Fase A: 54 reactivos + sincronización documental\n- tipo: content+taxonomy+docs+governance\n- modulo: question-bank-v4\n- resumen: El banco V4 pasa de 170 a 224 reactivos válidos con la Fase A de alto retorno (`DOC-001202`–`DOC-001255`). Se incorporan seis tópicos nuevos por necesidad editorial real y se sincronizan contrato operativo, skills de fábrica/auditoría, guías de agentes, estado/sprint y documentación técnica para evitar hardcodes o uso engañoso del “tópico más cercano”.\n- agente: ChatGPT GPT-5.6 Sol\n- via: GitHub connector / master\n- contributor: Marlon Medellin\n- environment: repo remoto / master\n- validacion: QA estructural/taxonómico completo sobre 224 JSON (`errors: []`) + revisión de referencias documentales V4\n- runtime-verified: no; expansión editorial y documental, sin importación ni deploy\n- relacionados: content/question-bank-v4/, docs/ai/skills/, AGENTS.md, content/README.md, content/GUIA-PARA-AGENTES-IA.md, docs/project/status.md, docs/02-delivery/sprint-log.md, docs/database/question-bank-v4-contract.md, docs/architecture/question-bank-v4-adoption.md, docs/05-ops/documentation-trigger-map.md\n\n'''
          after(p,'- Update trigger: governance, delivery, documentation, drift\n\n',block)

          # Required consistency markers.
          required={
            'docs/project/status.md':['224 reactivos','COVERAGE-AFTER-PHASE-A-20260822.json'],
            'docs/02-delivery/sprint-log.md':['224 reactivos','COVERAGE-AFTER-PHASE-A-20260822.json'],
            'content/README.md':['224 reactivos','DOC-001256'],
            'docs/ai/skills/GCM-Master-Question-Factory-Docentes.md':['Versión:** 1.2','No fuerces el valor'],
            'docs/ai/skills/GCM-Master-Question-Factory-OPEC-General.md':['Versión:** 1.2','No fuerces el valor'],
            'docs/ai/skills/GCM-Adversarial-Item-Auditor-Docentes.md':['Versión:** 1.2','brecha taxonómica'],
            'docs/ai/skills/GCM-Adversarial-Item-Auditor-OPEC-General.md':['Versión:** 1.2','brecha taxonómica'],
            'docs/05-ops/documentation-trigger-map.md':['question-bank-v4/taxonomy/','GCM-*Question*'],
          }
          for p,needles in required.items():
              s=get(p)
              for n in needles:
                  if n not in s: raise SystemExit(f'{p}: missing marker {n}')
          PY
          git diff --check
          python3 scripts/validate_docs.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add AGENTS.md content/README.md content/GUIA-PARA-AGENTES-IA.md docs/ai/skills docs/05-ops/documentation-trigger-map.md docs/database/question-bank-v4-contract.md docs/architecture/question-bank-v4-adoption.md docs/project/status.md docs/02-delivery/sprint-log.md docs/02-delivery/change-log.md
          git commit -m 'docs(v4): synchronize Phase A taxonomy and references'
          git pull --rebase origin master
          git push origin HEAD:master
